# Transactions without a workspace set, on purpose. Module tables answer
# nothing to such a transaction unless their own policy admits it.
[[access.pool_access]]
path = "crates/modules/identity/"
reason = "Identity's tables are instance-wide (accounts, ways in, passkeys, sessions, keys): none carries a workspace."

[[access.pool_access]]
path = "crates/modules/admin/src/cli.rs"
reason = "The admin CLI writes instance administrators' profiles on the migration login (ADR 0015)."

[[access.pool_access]]
path = "crates/modules/workspaces/src/domain/db.rs"
reason = "`begin_as_user`: a user's own rows (their workspaces, their security events) across workspaces, admitted by the `campbooks.user_id` policies."

[[access.pool_access]]
path = "crates/modules/workspaces/src/features/invitations_port/mod.rs"
reason = "Whether an address has a pending invitation, before any workspace: admitted by the `campbooks.invitee_email` policy."

[[access.pool_access]]
path = "crates/kernel/src/testing.rs"
reason = "Test helpers only (the `test-util` feature): `tracked_events` reads the tracked events outbox back with the test database's owner pool, since the runtime role may only append to it (ADR 0020)."

[[access.pool_access]]
path = "crates/modules/connectors/src/domain/schedule.rs"
reason = "Provider budgets are instance-wide (no workspace); the dispatcher itself works in the maintenance scope (`[[access.maintenance_scope]]`)."

[[access.pool_access]]
path = "crates/modules/connectors/src/zoho/flows.rs"
reason = "A test file (`#[cfg(test)] mod flows;`): fixtures publish from plain transactions."


[[access.pool_access]]
path = "crates/server/src/bff/store.rs"
reason = "The web BFF's session store (schema `bff`): sessions are instance-wide, none carries a workspace, and every statement calls one of the `bff.*` functions (the runtime role has no privilege on the tables, campbooks-cloud#212). It also opens the BFF's transactions (`begin`): the single-flight token refresh's, the one the refresh locks its session row in, and the one a session starts or ends in with its tracked event (ADR 0020)."

[[access.pool_access]]
path = "crates/kernel/src/db.rs"
reason = "Where the kernel opens its transactions: `begin_for`, `begin_admin`, `begin_kernel`, `begin_maintenance`, each setting its scope before any query."

[[access.pool_access]]
path = "crates/kernel/src/jobs/context.rs"
reason = "A job's transaction, opened on first use with the job's workspace set (or a scope: `kernel_tx`, `maintenance_tx`)."

# Cross-workspace work outside the kernel. A transaction in the kernel
# scope (`kernel::db::begin_kernel`, a job's `kernel_tx`) reaches every
# workspace's kernel rows (the queue, the event log, the change feed, the
# blob catalogue): no file outside the kernel may open it today
# (`[[access.kernel_scope]]` is empty; campbooks-cloud#129, #196). A module
# scheduler's dispatcher works in the narrower maintenance scope
# (`kernel::db::begin_maintenance`, a job's `maintenance_tx`), which only its
# own table's maintenance policies admit and no kernel table does; it
# enqueues each run in that run's workspace. A transaction that sets neither
# a workspace nor a scope sees nothing. Each entry is reviewed like an ADR.
[[access.maintenance_scope]]
path = "crates/modules/connectors/src/domain/schedule.rs"
reason = "The one-minute dispatcher leases due streams across workspaces (`connectors.sync_due` maintenance policies: ids and times, read and lease only) and enqueues each stream's run in its workspace."

[[access.maintenance_scope]]
path = "crates/modules/connectors/src/features/imap_idle/lease.rs"
reason = "IMAP push with IDLE (campbooks-cloud#318): each process's pool claims, renews, releases and gives up IDLE leases across workspaces, and a sync run counts its host's live IDLE sessions (`connectors.imap_idle_leases` maintenance policies: ids, keyed digests, a flag and times, read and update only; a trigger lets the scope change only holders and times). Everything a session does with a connection (its password, its stream's runs, a refusal) happens in that connection's workspace."

[[access.maintenance_scope]]
path = "crates/modules/connectors/src/features/microsoft_notifications/mod.rs"
reason = "Microsoft Graph's change notifications (campbooks-cloud#316): the public callback finds each notification's subscription across workspaces (`connectors.microsoft_subscriptions` maintenance policy: read only, ids, the clientState's keyed hash and the workspace) to check it; whatever it then does with a connection (its stream's run, a lifecycle notice) happens in that connection's workspace."

[[access.maintenance_scope]]
path = "crates/modules/connectors/src/features/notion_hook/mod.rs"
reason = "Notion's webhook (campbooks-cloud#376): the public hook finds the streams of a Notion page across workspaces (`connectors.notion_links` maintenance policy: read only, ids) after checking the post's signature, and only makes them due; whatever it then does with a stream (its run) happens in that stream's workspace. While no webhook secret is configured it also keeps the subscription's verification token, sealed, as the instance's one row (`connectors.notion_webhook_token`, no workspace data: the runtime role may replace it and never read it)."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/backfill_needs/mod.rs"
reason = "The needs backfill's dispatcher starts pending backfills across workspaces, and, once whose move it is is switched on, the finished ones that did not ask it (`conversations.needs_backfills` maintenance policies: ids and states, start only), and enqueues each inbox's page job in its workspace."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/resign_rules/mod.rs"
reason = "Binding the rules kept from before rules were bound (campbooks-cloud#242): the dispatcher reads which workspaces still have rows in `conversations.rule_resigns` (its maintenance policy: read only, ids and hashes) and enqueues each workspace's signing job in that workspace; it signs nothing itself."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/wake_needs/mod.rs"
reason = "Needs that change with time alone (campbooks-cloud#275): the one-minute dispatcher reads which workspaces have a due row in `conversations.need_clocks` (its maintenance policy: read only, ids and times) and enqueues each workspace's wake job in that workspace; it reads and writes nothing else."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/expire_explanations/mod.rs"
reason = "Explanations of threads are kept 30 days after they were written (campbooks-cloud#407): the daily dispatcher reads which workspaces hold an old one (`conversations.explanations` maintenance policy: read only, ids and times) and enqueues each workspace's expiry job in that workspace; it deletes nothing itself."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/sweep_overdue_sends/mod.rs"
reason = "A scheduled send must never stay scheduled for ever (campbooks-cloud#392): the ten-minute dispatcher asks `conversations.workspaces_with_overdue_sends` (a SECURITY DEFINER function owned by `campbooks_definer`, which may read only `workspace_id`, `state` and `send_at` of the drafts; it answers workspace ids) and enqueues the sweep job in each workspace with an overdue send; no policy lets this scope read a draft, and it writes nothing else."

[[access.maintenance_scope]]
path = "crates/modules/schedule/src/features/announce_invitations/mod.rs"
reason = "Invitations stored before invitations were announced (campbooks-cloud#360): the one-minute dispatcher reads which workspaces still have a row in `schedule.invitation_backfills` (its maintenance policy: read only, ids) and enqueues each workspace's announcing job in that workspace; it reads and writes nothing else."

[[access.maintenance_scope]]
path = "crates/modules/assistant/src/features/expire_chats/mod.rs"
reason = "Chats are kept 30 days after their last message (campbooks-cloud#305): the daily dispatcher reads which workspaces hold a chat to expire (`assistant.chats` maintenance policy: read only, ids and times) and enqueues each workspace's expiry job in that workspace; it deletes nothing itself."

[[access.maintenance_scope]]
path = "crates/modules/pages/src/features/purge_trash/mod.rs"
reason = "Pages are kept 30 days in the trash (campbooks-cloud#363): the daily dispatcher reads which workspaces hold a trash root older than that (`pages.pages` maintenance policy: read only, trash roots, ids and times) and enqueues each workspace's purge job in that workspace; it deletes nothing itself."

