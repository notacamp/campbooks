# Module dependency allowlist, read by `cargo xtask arch`.
#
# By default a module crate (crates/modules/<name>) may depend only on
# `campbooks-kernel` and `campbooks-ai`. Cross-module needs go through domain
# events on the kernel event bus. When a module truly needs another module's
# API, add an entry — it is reviewed like an ADR:
#
#   [[allow]]
#   from = "mail"          # the depending module (directory name)
#   to = "calendar"        # the module it may depend on
#   reason = "Why events are not enough, and the ADR/issue that approved it."
#
# Every entry must name existing modules and give a non-empty reason.

# (No entries yet.)

# Access rules (ADR 0017, `cargo xtask arch`): the reviewed exceptions.
[access]
# Module functions that call `authz` themselves for one resource type: a
# handler calling one asks the central check about it.
[[access.helpers]]
call = "lock_conversation("
resource = "conversations.conversation"

[[access.helpers]]
call = "drafts::load("
resource = "conversations.draft"

[[access.helpers]]
call = "flags::apply("
resource = "conversations.conversation"

[[access.helpers]]
call = "workspace_clients::require_admin("
resource = "identity.client"

# Functions that build the reference an `authorize` call is given: a handler
# calling `authorize` with one names that resource type.
[[access.references]]
call = "workspace_resource("
resource = "workspaces.workspace"

[[access.references]]
call = "member_resource("
resource = "workspaces.member"

[[access.references]]
call = "resources::inbox("
resource = "conversations.inbox"

# Operations whose handler does not call `authz` yet: the web BFF's session
# and proxy operations act on the cookie's own session, and the proxies run
# each request through the API, whose operations authorize it; moving them
# onto the catalogue is the follow-up change of the same issue.

