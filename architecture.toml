# Transactions without a workspace set, on purpose. Module tables answer
# nothing to such a transaction unless their own policy admits it.
[[access.pool_access]]
path = "crates/modules/identity/"
reason = "Identity's tables are instance-wide (accounts, ways in, passkeys, sessions, keys): none carries a workspace."

[[access.pool_access]]
path = "crates/modules/admin/src/cli.rs"
reason = "The admin CLI writes instance administrators' profiles on the migration login (ADR 0015)."

[[access.pool_access]]
path = "crates/modules/workspaces/src/domain/db.rs"
reason = "`begin_as_user`: a user's own rows (their workspaces, their security events) across workspaces, admitted by the `campbooks.user_id` policies."

[[access.pool_access]]
path = "crates/modules/workspaces/src/features/invitations_port/mod.rs"
reason = "Whether an address has a pending invitation, before any workspace: admitted by the `campbooks.invitee_email` policy."

[[access.pool_access]]
path = "crates/kernel/src/testing.rs"
reason = "Test helpers only (the `test-util` feature): `tracked_events` reads the tracked events outbox back with the test database's owner pool, since the runtime role may only append to it (ADR 0020)."

[[access.pool_access]]
path = "crates/modules/connectors/src/domain/schedule.rs"
reason = "Provider budgets are instance-wide (no workspace); the dispatcher itself works in the maintenance scope (`[[access.maintenance_scope]]`)."

[[access.pool_access]]
path = "crates/modules/connectors/src/zoho/flows.rs"
reason = "A test file (`#[cfg(test)] mod flows;`): fixtures publish from plain transactions."


[[access.pool_access]]
path = "crates/server/src/bff/store.rs"
reason = "The web BFF's session store (schema `bff`): sessions are instance-wide, none carries a workspace, and every statement calls one of the `bff.*` functions (the runtime role has no privilege on the tables, campbooks-cloud#212). It also opens the single-flight token refresh's transaction (`begin_refresh`), the one the refresh locks its session row in."

[[access.pool_access]]
path = "crates/kernel/src/db.rs"
reason = "Where the kernel opens its transactions: `begin_for`, `begin_admin`, `begin_kernel`, `begin_maintenance`, each setting its scope before any query."

[[access.pool_access]]
path = "crates/kernel/src/jobs/context.rs"
reason = "A job's transaction, opened on first use with the job's workspace set (or a scope: `kernel_tx`, `maintenance_tx`)."

# Cross-workspace work outside the kernel. A transaction in the kernel
# scope (`kernel::db::begin_kernel`, a job's `kernel_tx`) reaches every
# workspace's kernel rows (the queue, the event log, the change feed, the
# blob catalogue): no file outside the kernel may open it today
# (`[[access.kernel_scope]]` is empty; campbooks-cloud#129, #196). A module
# scheduler's dispatcher works in the narrower maintenance scope
# (`kernel::db::begin_maintenance`, a job's `maintenance_tx`), which only its
# own table's maintenance policies admit and no kernel table does; it
# enqueues each run in that run's workspace. A transaction that sets neither
# a workspace nor a scope sees nothing. Each entry is reviewed like an ADR.
[[access.maintenance_scope]]
path = "crates/modules/connectors/src/domain/schedule.rs"
reason = "The one-minute dispatcher leases due streams across workspaces (`connectors.sync_due` maintenance policies: ids and times, read and lease only) and enqueues each stream's run in its workspace."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/backfill_needs/mod.rs"
reason = "The needs backfill's dispatcher starts pending backfills across workspaces (`conversations.needs_backfills` maintenance policies: ids and states, start only) and enqueues each inbox's page job in its workspace."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/resign_rules/mod.rs"
reason = "Binding the rules kept from before rules were bound (campbooks-cloud#242): the dispatcher reads which workspaces still have rows in `conversations.rule_resigns` (its maintenance policy: read only, ids and hashes) and enqueues each workspace's signing job in that workspace; it signs nothing itself."

[[access.maintenance_scope]]
path = "crates/modules/conversations/src/features/wake_needs/mod.rs"
reason = "Needs that change with time alone (campbooks-cloud#275): the one-minute dispatcher reads which workspaces have a due row in `conversations.need_clocks` (its maintenance policy: read only, ids and times) and enqueues each workspace's wake job in that workspace; it reads and writes nothing else."

