name: CI

# Every deterministic code gate (ADR 0007). Job names are short because the
# workflow name is the section on a PR: `CI / rust`, `CI / clients`, …
# A job name is a required-check interface — renaming one means updating the
# branch ruleset in the same change.

on:
  pull_request:
  push:
    branches: [next]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  # Line numbers in backtraces without full debug info: faster links and
  # smaller caches for the four test shards.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # The Rust gates run as parallel jobs (checks, the scaffold check, the tests
  # in four shards); `rust`, the required check, is green only when all are.
  rust-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campbooks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campbooks
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2 # reads rust-toolchain.toml
        with: { cache: false }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/next' }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-machete,sqlx-cli" }
      - name: Format
        if: always()
        run: cargo fmt --all --check
      - name: Clippy
        if: always()
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Architecture (module boundaries, migration names)
        if: always()
        run: cargo xtask arch
      - name: New migrations sort after the base branch's
        if: always() && github.event_name == 'pull_request'
        env: { BASE: "${{ github.base_ref }}" }
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          cargo xtask migrations --base "origin/$BASE"
      - name: OpenAPI drift
        id: openapi
        if: always()
        run: cargo xtask openapi --check
      - name: Events catalogue drift
        id: events
        if: always()
        run: cargo xtask events --check
      # On drift, write the documents the server generates and upload them,
      # so a change can commit them without compiling the server locally.
      # The checks above still fail the job.
      - name: Generate the stale API documents
        if: always() && (steps.openapi.outcome == 'failure' || steps.events.outcome == 'failure')
        run: |
          cargo xtask openapi
          cargo xtask events
      - name: Upload the generated API documents
        if: always() && (steps.openapi.outcome == 'failure' || steps.events.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-openapi
          path: |
            openapi/openapi.json
            openapi/admin.json
            openapi/events.json
          retention-days: 7
          if-no-files-found: error
      - name: decide eval holds its baseline (offline strategies, no network)
        if: always()
        run: cargo xtask eval decide --offline --check
      - name: Translations at parity (server)
        if: always()
        run: cargo xtask i18n
      - name: sqlx offline cache is current
        if: always()
        # Online check needs the schema the queries were prepared against.
        run: |
          cargo sqlx migrate run --source migrations
          cargo sqlx prepare --workspace --check -- --all-targets
        env: { SQLX_OFFLINE: "false" }
      - name: Unused dependencies
        if: always()
        run: cargo machete

  rust-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campbooks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campbooks
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2 # reads rust-toolchain.toml
        with: { cache: false }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/next' }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-machete" }
      - name: Generated module and feature pass the gates
        # `cargo xtask new-module` + `new-feature` in a temporary copy, then
        # fmt, OpenAPI, arch, clippy, the generated tests and machete on it.
        run: cargo xtask scaffold-check

  rust-tests:
    # Each shard builds the tests (the dependencies come from the cache) and
    # runs a quarter of them: one runner has 4 cores, and the tests keep all
    # four busy for ~8 minutes, so more runners is what makes them faster.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campbooks
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campbooks
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2 # reads rust-toolchain.toml
        with: { cache: false }
      - uses: Swatinem/rust-cache@v2
        with: { save-if: "${{ github.ref == 'refs/heads/next' && matrix.shard == 1 }}" }
      - uses: taiki-e/install-action@v2
        with: { tool: "cargo-nextest" }
      - name: Tests (shard ${{ matrix.shard }} of 4)
        run: cargo nextest run --workspace --no-tests=warn --partition "count:${{ matrix.shard }}/4"
      - name: Doc tests
        if: matrix.shard == 1
        run: cargo test --workspace --doc

  rust:
    # The required check: every Rust job above passed.
    if: always()
    needs: [rust-checks, rust-scaffold, rust-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "rust-checks, rust-scaffold, rust-tests: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: clients/app/src-tauri/Cargo.toml
          arguments: --config clients/app/src-tauri/deny.toml
          command: check advisories bans sources

  # The clients gates run as parallel jobs (each suite on its own runner, a
  # minute of setup each instead of ~15 minutes in a row); `clients`, the
  # required check, is green only when all are.
  clients-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clients-setup
      - name: Lint
        if: always()
        run: pnpm lint
      - name: Format
        if: always()
        run: pnpm format:check
      - name: Typecheck
        if: always()
        run: pnpm typecheck
      - name: Module boundaries
        if: always()
        run: pnpm deps:check
      - name: Dead code
        if: always()
        run: pnpm deadcode
      - name: Generated API types are current
        id: api-types
        if: always()
        run: pnpm api:check
      # `api:check` regenerates the types from the committed OpenAPI
      # documents before it diffs them: on drift, upload what it wrote. After
      # a server change, commit `generated-openapi` first; the types follow
      # from those documents on the next run.
      - name: Upload the generated API types
        if: always() && steps.api-types.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated-api-types
          path: clients/app/src/lib/api/*.gen.ts
          retention-days: 7
          if-no-files-found: error
      - name: Translations at parity (en, pt, es, fr)
        if: always()
        run: pnpm i18n:check
      - name: Build
        if: always()
        run: pnpm build
      - name: Audit (prod deps)
        if: always()
        run: pnpm audit --prod

  clients-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clients-setup
      - name: Tests + coverage
        run: pnpm test

  clients-stories:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clients-setup
        with: { playwright: chromium }
      - name: Storybook stories (render, interactions, axe in light and dark)
        run: pnpm test-storybook

  clients-fit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clients-setup
        with: { playwright: chromium }
      - name: Copy fits in every language (longest translations, phone and desktop)
        run: pnpm --filter @campbooks/app test:fit

  clients-webkit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/clients-setup
        with: { playwright: webkit }
      - name: Mail frame under the desktop and web page policies (WebKit)
        run: pnpm --filter @campbooks/app test:csp

  clients:
    # The required check: every clients job above passed.
    if: always()
    needs: [clients-checks, clients-tests, clients-stories, clients-fit, clients-webkit]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "clients-checks, clients-tests, clients-stories, clients-fit, clients-webkit: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || exit 1; done

  tauri:
    # The native shell is its own Cargo workspace so GUI system libraries never
    # enter the server build; it still gets fmt + clippy on every PR.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients/app/src-tauri }
    steps:
      - uses: actions/checkout@v6
      - name: System libraries for Tauri (Linux)
        uses: ./.github/actions/apt-packages
        with:
          # The same set (and cache) as tauri-shell, so one warm cache covers
          # both; the driver and xvfb are small and unused here.
          key: tauri-shell
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with: { cache: false, components: "rustfmt,clippy" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: clients/app/src-tauri }
      - name: Frontend dist placeholder (tauri::generate_context! needs it)
        run: mkdir -p ../dist && touch ../dist/index.html
      - name: Format
        if: always()
        run: cargo fmt --all --check
      - name: Clippy
        if: always()
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (links open outside, IPC grants, the page policy)
        if: always()
        run: cargo test

  tauri-shell:
    # The mail frame in the real desktop shell (campbooks-cloud#237): a debug
    # build driven by tauri-driver and WebKitWebDriver under a virtual display,
    # against a mock API serving hostile HTML mail. Its own job, in parallel
    # with the rest, and not a required check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run: { working-directory: clients }
    steps:
      - uses: actions/checkout@v6
      - name: System libraries, WebKitWebDriver and a virtual display
        uses: ./.github/actions/apt-packages
        with:
          key: tauri-shell
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf webkit2gtk-driver xvfb
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with: { cache: false }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: clients/app/src-tauri, key: shell }
      - name: tauri-driver
        run: cargo install tauri-driver --version 2.1.0 --locked
      - uses: pnpm/action-setup@v6
        with: { package_json_file: clients/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: clients/.nvmrc
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Debug build of the desktop app
        run: pnpm --filter @campbooks/app tauri build --debug --no-bundle
      - name: The mail frame in the real shell (no IPC, no script, nothing outside)
        run: xvfb-run -a pnpm --filter @campbooks/app test:tauri

  image:
    # On a pull request: builds the release image exactly as published and
    # scans it. Not pushed. (On a push to next, `image-push` below does it.)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: campbooks:ci
          build-args: GIT_SHA=${{ github.sha }}
          # Read the registry cache `image-push` refreshes on every push to
          # next (a PR's own gha cache is visible to that PR only).
          cache-from: |
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/campbooks:buildcache-next-linux-amd64
            type=gha
          cache-to: type=gha,mode=max
      - name: Trivy (HIGH/CRITICAL, fixable)
        # Pinned by SHA: this action's tags have been tampered with before.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: campbooks:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # On a push to next, build both images once, on both architectures, scan
  # and attest them, and push them as `ci-<sha>` while the tests run. When CI
  # is green, `publish-next.yml` only adds the `next-<sha>` and `next` tags
  # and dispatches the deploys: nothing is built twice, and nothing is
  # deployed before CI is green.
  image-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ github.sha }}
      tags: ci-${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  laya-image-push:
    if: github.event_name == 'push'
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ github.sha }}
      image: campbooks-laya
      context: deploy/laya
      tags: ci-${{ github.sha }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  laya-image:
    # Builds the Laya model server image (deploy/laya, the `decide` role) as
    # published, natively on both architectures, and scans it. Not pushed. The
    # image is large, so the build is skipped unless something it is built
    # from (or its recipe) changed.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, arch: amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64 }
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }
      - name: Changed?
        id: changed
        env:
          BASE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          paths=(deploy/laya .github/workflows/ci.yml .github/workflows/image.yml)
          # A PR: its own changes, between the merge ref's parents (the base
          # tip now, the PR's head), never those of PRs merged since it was
          # opened (campbooks-cloud#231). A push: since the previous tip.
          if [ "$EVENT" = pull_request ] && git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            set -- 'HEAD^1...HEAD^2'
          else
            set -- "$BASE" HEAD
          fi
          if ! files=$(git diff --name-only "$@" -- "${paths[@]}" 2>/dev/null); then
            files=unknown   # no usable base (new branch, force push): build anyway
          fi
          if [ -n "$files" ]; then echo "run=true"; else echo "run=false"; fi >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
        if: steps.changed.outputs.run == 'true'
      - uses: docker/build-push-action@v7
        if: steps.changed.outputs.run == 'true'
        with:
          context: deploy/laya
          load: true
          tags: campbooks-laya:ci
          cache-from: type=gha,scope=laya-${{ matrix.arch }}
          cache-to: type=gha,scope=laya-${{ matrix.arch }},mode=max
      - name: Trivy (HIGH/CRITICAL, fixable)
        if: steps.changed.outputs.run == 'true'
        # Pinned by SHA: this action's tags have been tampered with before.
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: campbooks-laya:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Smoke test (refuses no key; answers a decide request)
        # Starts the image as compose does, lets it download the checkpoint, and
        # times a few typed decisions on this runner's CPU (3 threads, as in the
        # production budget). Fake email, no secrets: the key is generated here.
        if: steps.changed.outputs.run == 'true'
        timeout-minutes: 15
        run: |
          set +e
          docker run --rm campbooks-laya:ci; code=$?
          set -e
          [ "$code" = 64 ] || { echo "::error::expected exit 64 without LAYA_API_KEY, got $code"; exit 1; }
          key=$(openssl rand -hex 16)
          # A failed checkpoint download (Hugging Face answering 5xx) exits the
          # container; like `restart: unless-stopped` in compose, restart it.
          docker run -d --name laya --restart on-failure:5 -p 127.0.0.1:8000:8000 \
            -e LAYA_API_KEY="$key" -e LAYA_THREADS=3 --cpus 3 campbooks-laya:ci
          for i in $(seq 1 120); do
            s=$(docker inspect -f '{{.State.Health.Status}}' laya)
            [ "$s" = healthy ] && break
            if [ "$(docker inspect -f '{{.State.Status}}' laya)" = exited ]; then
              echo "::error::laya exited after $(docker inspect -f '{{.RestartCount}}' laya) restarts"
              docker logs --tail 50 laya; exit 1
            fi
            sleep 5
          done
          [ "$s" = healthy ] || { docker logs --tail 50 laya; exit 1; }
          echo "healthy after ~$((i * 5)) s, $(docker inspect -f '{{.RestartCount}}' laya) restarts (checkpoint download included)"
          cat > /tmp/req.json <<'JSON'
          {"model": "convaiinnovations/laya-multilingual",
           "state": {"from": "Ana <ana@example.com>", "subject": "Invoice 2026-114 due Friday",
                     "body": "Hi, attached is invoice 2026-114 for the September work. Could you confirm it will be paid by Friday? Thanks, Ana"},
           "questions": {
             "category": {"type": "choice", "instructions": "What is this email about?",
                          "criteria": {"invoice": "A bill or payment request", "newsletter": "A newsletter or marketing", "personal": "A personal message"}},
             "urgency": {"type": "score", "instructions": "How urgent is it?", "criteria": ["not urgent", "this week", "today"]},
             "asks_user": {"type": "noul", "instructions": "The sender asks the recipient to do something."}}}
          JSON
          for n in 1 2 3 4 5; do
            curl -sS -o /tmp/answer.json -w "request $n: HTTP %{http_code} in %{time_total} s\n" \
              -H "Authorization: Bearer $key" -H 'Content-Type: application/json' \
              --data @/tmp/req.json http://127.0.0.1:8000/v1/systemone | tee /tmp/status
            grep -q 'HTTP 200' /tmp/status || { cat /tmp/answer.json; docker logs --tail 50 laya; exit 1; }
          done
          jq -c '.answers' /tmp/answer.json
          docker stats --no-stream --format 'memory: {{.MemUsage}}' laya
          docker rm -f laya >/dev/null
