name: Publish next

# Every green push to `next` becomes a multi-arch image and a staging deploy:
#
#   CI (on next) succeeds → build amd64 + arm64 natively → manifest
#   ghcr.io/notacamp/campbooks:next and :next-<sha> → Trivy → dispatch
#   `campbooks-next-staging` to the private cloud repo, which pulls the tag.
#
# Tags stay in the `next*` namespace until cutover so they never collide with
# the Rails releases (`X.Y.Z`, `latest`) published from `main`. The build,
# scan and attestation live in `image.yml`; versioned releases of next are
# `release-next.yml`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-next
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  plan:
    # workflow_run fires for PR runs too; only publish green pushes to next.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha_tag: ${{ steps.ref.outputs.sha_tag }}
    steps:
      - id: ref
        env:
          # Build exactly the commit CI approved, not whatever next is now.
          REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha_tag=next-${REF:0:12}" >> "$GITHUB_OUTPUT"

  image:
    needs: plan
    uses: ./.github/workflows/image.yml
    with:
      ref: ${{ needs.plan.outputs.ref }}
      tags: |
        ${{ needs.plan.outputs.sha_tag }}
        next
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

  deploy-staging:
    needs: [plan, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the staging deploy (cloud repo)
        # Best-effort like the Rails release dispatch: an expired token must not
        # fail a publish whose image is already pushed. Recover by hand with
        # `gh workflow run deploy-next-staging.yml -R <owner>/campbooks-cloud -f tag=<tag>`.
        env:
          DISPATCH_TOKEN: ${{ secrets.CAMPBOOKS_CLOUD_DISPATCH_TOKEN }}
          TAG: ${{ needs.plan.outputs.sha_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::CAMPBOOKS_CLOUD_DISPATCH_TOKEN not set — deploy $TAG by hand."
            exit 0
          fi
          code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$OWNER/campbooks-cloud/dispatches" \
            -d "{\"event_type\":\"campbooks-next-staging\",\"client_payload\":{\"tag\":\"$TAG\"}}")
          if [ "$code" = "204" ]; then
            echo "Dispatched staging deploy of $TAG."
          else
            echo "::warning::Staging dispatch returned HTTP $code: $(cat /tmp/dispatch.out)"
          fi
