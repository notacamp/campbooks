name: Publish next

# Every green push to `next` is tagged for deploy and deployed to staging and
# production:
#
#   CI (on next) builds both images on amd64 + arm64, scans and attests them,
#   and pushes them as `ci-<sha>` while the tests run → CI succeeds → this
#   adds `next-<sha>` and `next` to those same digests → dispatch
#   `campbooks-next-staging` and `campbooks-next-prod` to the private cloud
#   repo, which pull the tag.
#
# The Laya model server (the `decide` role, deploy/laya) is published next to
# it as ghcr.io/notacamp/campbooks-laya with the same tags, so a deploy pins
# both images with one tag.
#
# Tags stay in the `next*` namespace until cutover so they never collide with
# the Rails releases (`X.Y.Z`, `latest`) published from `main`. The build,
# scan and attestation live in `image.yml`; versioned releases of next are
# `release-next.yml`.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Only a green push to next (or a manual run) publishes. Every other CI
  # completion (a failed run, or one dropped because a newer push was
  # queued) gets a group of its own, so it can never cancel a publish in
  # flight and leave that round undeployed.
  group: >-
    ${{ (github.event_name == 'workflow_dispatch' ||
         (github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push'))
        && 'publish-next' || format('publish-next-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  plan:
    # workflow_run fires for PR runs too; only publish green pushes to next.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
      sha_tag: ${{ steps.ref.outputs.sha_tag }}
    steps:
      - id: ref
        env:
          # Build exactly the commit CI approved, not whatever next is now.
          REF: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "sha_tag=next-${REF:0:12}" >> "$GITHUB_OUTPUT"

  promote:
    # CI built, scanned and attested both images for this commit as
    # `ci-<sha>`. Give the same digests the deploy tags; the attestations
    # are bound to the digest, so they still apply.
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tag the images CI built
        env:
          REF: ${{ needs.plan.outputs.ref }}
          SHA_TAG: ${{ needs.plan.outputs.sha_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -o pipefail
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          for image in campbooks campbooks-laya; do
            repo="ghcr.io/$OWNER/$image"
            built=$(digest "$repo:ci-$REF") || {
              echo "::error::$repo:ci-$REF is missing: CI builds it on every push to next"; exit 1; }
            docker buildx imagetools create -t "$repo:$SHA_TAG" -t "$repo:next" "$repo@$built"
            tagged=$(digest "$repo:$SHA_TAG")
            [ "$tagged" = "$built" ] || {
              echo "::error::$repo:$SHA_TAG is $tagged, not the $built CI scanned"; exit 1; }
            echo "$repo:$SHA_TAG and :next → $built"
          done

  deploy:
    needs: [plan, promote]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch the staging and production deploys (cloud repo)
        # Every green push to next deploys the image it just published, to
        # staging and to production. Best-effort like the Rails release
        # dispatch: an expired token must not fail a publish whose image is
        # already pushed. Recover by hand with
        # `gh workflow run deploy-next-staging.yml -R <owner>/campbooks-cloud -f tag=<tag>`
        # (or deploy-next-prod.yml).
        env:
          DISPATCH_TOKEN: ${{ secrets.CAMPBOOKS_CLOUD_DISPATCH_TOKEN }}
          TAG: ${{ needs.plan.outputs.sha_tag }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::CAMPBOOKS_CLOUD_DISPATCH_TOKEN not set — deploy $TAG by hand."
            exit 0
          fi
          for target in staging prod; do
            code=$(curl -sS -o /tmp/dispatch.out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $DISPATCH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$OWNER/campbooks-cloud/dispatches" \
              -d "{\"event_type\":\"campbooks-next-$target\",\"client_payload\":{\"tag\":\"$TAG\"}}")
            if [ "$code" = "204" ]; then
              echo "Dispatched the $target deploy of $TAG."
            else
              echo "::warning::The $target dispatch returned HTTP $code: $(cat /tmp/dispatch.out)"
            fi
          done
