name: Publish @notacamp/ui

# Publishes the design system (clients/ui) to GitHub Packages, the npm
# registry at npm.pkg.github.com, as @notacamp/ui, for the other Not A Camp
# apps (clients/ui/README.md says how they install it). Campbooks itself never
# installs it from there: it uses the source in this repository.
#
# A release is a tag `ui-v<version>` on a commit of `next`, where <version> is
# clients/ui/package.json's `version` (bump it in a PR first):
#
#   git tag ui-v0.1.0 <commit on next> && git push origin ui-v0.1.0
#
# `workflow_dispatch` re-runs a release: pick the tag under "Use workflow
# from". Any other ref, a tag whose commit is not on next, or a tag that does
# not match the version fails before anything is built.
#
# The only credential is the job's own GITHUB_TOKEN, with `packages: write`
# (and `contents: read` to check out). No other secret is used.

on:
  push:
    tags: ["ui-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-ui
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    defaults:
      run: { working-directory: clients }
    steps:
      - name: Runs from a ui-v* tag only
        working-directory: .
        run: |
          case "$GITHUB_REF" in
            refs/tags/ui-v*) echo "Publishing $GITHUB_REF_NAME ($GITHUB_SHA)." ;;
            *) echo "::error::Publish @notacamp/ui runs from a ui-v* tag, not $GITHUB_REF."; exit 1 ;;
          esac
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tagged commit is on next
        working-directory: .
        run: |
          git fetch --no-tags origin +refs/heads/next:refs/remotes/origin/next
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/next; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on next. Tag a commit of next."
            exit 1
          fi
      - name: The tag is the package's version
        run: |
          version=$(node -p "require('./ui/package.json').version")
          if [ "$GITHUB_REF_NAME" != "ui-v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match clients/ui/package.json ($version): tag ui-v$version, or bump the version first."
            exit 1
          fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with: { package_json_file: clients/package.json }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: clients/.nvmrc
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
          # Writes an .npmrc for the registry; the token comes from
          # NODE_AUTH_TOKEN at publish time.
          registry-url: https://npm.pkg.github.com
          scope: "@notacamp"
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter @notacamp/ui build
      - name: Publish to GitHub Packages
        working-directory: clients/ui
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm publish --no-git-checks
