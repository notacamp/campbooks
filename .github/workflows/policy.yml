name: Policy

# Gates on the PR's process and the repo's hygiene rather than its runtime
# behaviour: PR title, changelog entries, tracking-plan patches, UI
# recording, specs, secrets. Each step runs `if: always()` so one failure
# never hides another.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }

      - name: The PR's own changes
        # The checkout is the PR's merge ref, built on the base branch as it
        # is now: parent 1 is that base tip, parent 2 the PR's head. Diffing
        # the two (from their merge base) gives the PR's own files, never
        # those of PRs merged since it was opened, which `base.sha` (the base
        # tip when the PR was opened) would add (campbooks-cloud#231).
        if: always() && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            range='HEAD^1...HEAD^2'
          else
            range="origin/${BASE_REF}...HEAD"
          fi
          echo "PR_RANGE=$range" >> "$GITHUB_ENV"
          # The PR's own tree (parent 2 of the merge ref), for what it leaves behind.
          if git rev-parse -q --verify 'HEAD^2' >/dev/null; then
            echo "PR_HEAD=HEAD^2" >> "$GITHUB_ENV"
          else
            echo "PR_HEAD=HEAD" >> "$GITHUB_ENV"
          fi
          echo "The PR's own changes ($range):"
          git diff --name-only "$range" | sed 's/^/  /'

      - name: PR title is a Conventional Commit
        if: always() && github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(mail): thread view'. Got: $TITLE"
            exit 1
          fi

      - name: Changelog entry on feat and fix PRs
        # One file per entry under changelog/unreleased/<kind>/, so parallel
        # PRs never touch the same lines (changelog/README.md). Required when
        # the branch (feat/, fix/) or the title (feat:, fix:) says so.
        if: always() && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$HEAD_REF" in feat/*|fix/*) needed=1 ;; *) needed= ;; esac
          if [[ "$TITLE" =~ ^(feat|fix)(\([a-z0-9-]+\))?!?: ]]; then needed=1; fi
          if [ -z "$needed" ]; then
            echo "Not a feat or fix PR — no changelog entry required."; exit 0
          fi
          added=$(git diff --name-only --find-renames --diff-filter=AM "$PR_RANGE" -- changelog/unreleased \
                    | grep -v '/\.gitkeep$' || true)
          if [ -z "$added" ]; then
            echo "::error::feat and fix PRs add a changelog entry: .github/scripts/changelog.sh new <added|changed|fixed|...> <issue>-<slug>, then write it (changelog/README.md)."
            exit 1
          fi
          echo "Changelog entries:"; echo "$added" | sed 's/^/  /'

      - name: Changelog entries are well-formed
        if: always()
        run: .github/scripts/changelog.sh check

      - name: CHANGELOG.md is written only by a release
        # Entries go in changelog/unreleased/; CHANGELOG.md changes only in the
        # PR that cuts a release (`changelog.sh release`), which must take
        # every entry its branch had with it; entries merged into next while
        # it was open stay for the following release. Only a release deletes
        # entries. A maintainer fixing a released or unreleased entry by hand
        # applies the `changelog-edit` label.
        if: >-
          always() && github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'changelog-edit')
        run: |
          if git diff --quiet "$PR_RANGE" -- CHANGELOG.md; then
            deleted=$(git diff --name-only --no-renames --diff-filter=D "$PR_RANGE" -- changelog/unreleased \
                        | grep -v '/\.gitkeep$' || true)
            if [ -n "$deleted" ]; then
              echo "::error::This PR deletes (or moves) changelog entries it did not add; only a release removes them. Restore them with git checkout origin/next -- <path>:"
              echo "$deleted" | sed 's/^/  /'
              exit 1
            fi
            echo "CHANGELOG.md unchanged."; exit 0
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if git ls-remote --exit-code --tags origin "refs/tags/next-v${version}" >/dev/null 2>&1 ||
             ! .github/scripts/release-notes.sh "$version" >/dev/null 2>&1; then
            echo "::error::Don't edit CHANGELOG.md: add your entry as a file with .github/scripts/changelog.sh new <kind> <slug> (changelog/README.md). CHANGELOG.md is written only when a release is cut (CONTRIBUTING.md → Releases)."
            exit 1
          fi
          left=$(git ls-tree -r --name-only "$PR_HEAD" -- changelog/unreleased | grep -v '/\.gitkeep$' || true)
          if [ -n "$left" ]; then
            echo "::error::This PR cuts next-v${version} but leaves entries behind; run .github/scripts/changelog.sh release on the branch again so they are released and removed:"
            echo "$left" | sed 's/^/  /'
            exit 1
          fi
          echo "This PR cuts next-v${version}."

      - name: Tracking plan changes come through a patch
        # The tracking plan's history is its patches (tracking/patches/), so
        # a PR that changes the workbook or its JSON mirror says what it
        # changed as a patch, which reviewers read as text (docs/tracking.md).
        if: always() && github.event_name == 'pull_request'
        run: |
          plan=$(git diff --name-only "$PR_RANGE" -- tracking/tracking-plan.xlsx tracking/tracking-plan.json)
          if [ -z "$plan" ]; then echo "The tracking plan is unchanged."; exit 0; fi
          echo "Tracking plan files changed:"; echo "$plan" | sed 's/^/  /'
          patches=$(git diff --name-only --diff-filter=AM "$PR_RANGE" -- tracking/patches/)
          if [ -z "$patches" ]; then
            echo "::error::This PR changes the tracking plan but adds or changes no patch under tracking/patches/. Write the rows you changed as a patch (the next free number) and apply it with cargo run -p campbooks-tracking-plan -- apply tracking/patches/<nnnn>-<slug>.yaml, which rewrites the workbook and the mirror for you. See docs/tracking.md (Adding an event)."
            exit 1
          fi
          echo "Patches:"; echo "$patches" | sed 's/^/  /'

      - name: UI PRs include a screen recording
        # A PR that changes the client UI must show it working: a `## Recording`
        # section with at least one video/GIF link (375px + desktop, demo data
        # only). Maintainers: `upload-media`. Contributors: drag the file into
        # the PR body (GitHub hosts it). Genuinely non-visual UI-code changes:
        # a maintainer applies the `no-recording` label.
        if: >-
          always() && github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'no-recording')
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          ui=$(git diff --name-only "$PR_RANGE" -- clients/app/src clients/app/index.html \
                 | grep -vE '\.(test|spec)\.[jt]sx?$|/schema\.gen\.ts$' || true)
          if [ -z "$ui" ]; then echo "No client UI changes — no recording required."; exit 0; fi
          echo "UI files changed:"; echo "$ui" | sed 's/^/  /'
          section=$(printf '%s\n' "$BODY" | awk '/^##[[:space:]]+Recording/{on=1; next} /^##[[:space:]]/{on=0} on')
          media='https://[^ )"]+\.(mp4|webm|mov|gif)([?#][^ )"]*)?|https://github\.com/user-attachments/assets/[A-Za-z0-9-]+'
          if printf '%s' "$section" | grep -qE "$media"; then
            echo "Recording found."
          else
            echo "::error::This PR changes UI but its body has no '## Recording' section with a video/GIF link (375px + desktop, demo data only). See CONTRIBUTING.md → Screen recordings."
            exit 1
          fi

      - name: A VERSION bump rolls the changelog
        if: always() && github.event_name == 'pull_request'
        run: |
          if git diff --quiet "$PR_RANGE" -- VERSION; then
            echo "VERSION unchanged."; exit 0
          fi
          version=$(tr -d '[:space:]' < VERSION)
          if git ls-remote --exit-code --tags origin "refs/tags/next-v${version}" >/dev/null 2>&1; then
            echo "::error::next-v${version} is already released; bump VERSION to a new version."
            exit 1
          fi
          if ! .github/scripts/release-notes.sh "$version" >/dev/null; then
            echo "::error::VERSION is now ${version} but CHANGELOG.md has no '## [next-v${version}]' section: cut releases with .github/scripts/changelog.sh release (CONTRIBUTING.md → Releases)."
            exit 1
          fi
          echo "Release next-v${version} is ready to be cut on merge."

      - name: OpenSpec specs and changes are valid
        if: always()
        run: npx -y @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
        env: { OPENSPEC_TELEMETRY: "0" }

      - name: No secrets (gitleaks)
        if: always()
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # Only commits reachable from HEAD: `next` is an orphan branch, so this
          # never walks the Rails history on `main` (whose hits are test fixtures).
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="HEAD" .
