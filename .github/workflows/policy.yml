name: Policy

# Gates on the PR's process and the repo's hygiene rather than its runtime
# behaviour: PR title, changelog, UI recording, specs, secrets. Each step runs `if: always()`
# so one failure never hides another.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [next]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: PR title is a Conventional Commit
        if: always() && github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'feat(mail): thread view'. Got: $TITLE"
            exit 1
          fi

      - name: Changelog entry on feat/ and fix/ branches
        if: always() && github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$HEAD_REF" in
            feat/*|fix/*)
              if ! git diff --name-only "$BASE_SHA"...HEAD | grep -qx CHANGELOG.md; then
                echo "::error::feat/ and fix/ PRs must add a line under [Unreleased] in CHANGELOG.md"
                exit 1
              fi ;;
            *) echo "Not a feat/ or fix/ branch — no changelog entry required." ;;
          esac

      - name: UI PRs include a screen recording
        # A PR that changes the client UI must show it working: a `## Recording`
        # section with at least one video/GIF link (375px + desktop, demo data
        # only). Maintainers: `upload-media`. Contributors: drag the file into
        # the PR body (GitHub hosts it). Genuinely non-visual UI-code changes:
        # a maintainer applies the `no-recording` label.
        if: >-
          always() && github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'no-recording')
        env:
          BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          ui=$(git diff --name-only "$BASE_SHA"...HEAD -- clients/app/src clients/app/index.html \
                 | grep -vE '\.(test|spec)\.[jt]sx?$|/schema\.gen\.ts$' || true)
          if [ -z "$ui" ]; then echo "No client UI changes — no recording required."; exit 0; fi
          echo "UI files changed:"; echo "$ui" | sed 's/^/  /'
          section=$(printf '%s\n' "$BODY" | awk '/^##[[:space:]]+Recording/{on=1; next} /^##[[:space:]]/{on=0} on')
          media='https://[^ )"]+\.(mp4|webm|mov|gif)([?#][^ )"]*)?|https://github\.com/user-attachments/assets/[A-Za-z0-9-]+'
          if printf '%s' "$section" | grep -qE "$media"; then
            echo "Recording found."
          else
            echo "::error::This PR changes UI but its body has no '## Recording' section with a video/GIF link (375px + desktop, demo data only). See CONTRIBUTING.md → Screen recordings."
            exit 1
          fi

      - name: OpenSpec specs and changes are valid
        if: always()
        run: npx -y @fission-ai/openspec@1.13.2 validate --all --strict --no-interactive
        env: { OPENSPEC_TELEMETRY: "0" }

      - name: No secrets (gitleaks)
        if: always()
        env: { GITLEAKS_VERSION: "8.30.1" }
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          # Only commits reachable from HEAD: `next` is an orphan branch, so this
          # never walks the Rails history on `main` (whose hits are test fixtures).
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts="HEAD" .
