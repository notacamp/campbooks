name: regen-pages

# TEMPORARY, for the pages change (campbooks-cloud#363): the owner's rule is
# that nothing is built on a laptop, so what only a toolchain can write (the
# pnpm lockfile, prettier's formatting, the tracking plan's workbook and
# generated code) is written here and committed from the artifacts. Runs only
# when `.github/regen-request` changes on this branch. Deleted before the PR
# is ready.

on:
  push:
    branches: [feat/pages-core]
    paths: [".github/regen-request"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  clients:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with: { package_json_file: clients/package.json }
      - uses: actions/setup-node@v7
        with:
          node-version-file: clients/.nvmrc
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml
      - name: Resolve and install
        working-directory: clients
        run: pnpm install --no-frozen-lockfile
      - name: Generated API types
        working-directory: clients
        run: pnpm api:generate
      - name: Format
        working-directory: clients
        run: pnpm format || true
      - name: Lint fixes
        working-directory: clients
        run: pnpm --filter @campbooks/app exec eslint . --fix || true
      - name: Collect what changed
        run: |
          git status --short
          git diff --name-only > /tmp/changed.txt
          git ls-files --others --exclude-standard >> /tmp/changed.txt
          grep -v '^$' /tmp/changed.txt | sort -u > /tmp/changed-sorted.txt || true
          tar czf /tmp/regen-clients.tgz -T /tmp/changed-sorted.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regen-clients
          path: /tmp/regen-clients.tgz
          retention-days: 3
          if-no-files-found: error

  tracking:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with: { cache: false }
      - uses: Swatinem/rust-cache@v2
      - name: Apply the tracking patch, if there is one
        run: |
          set -x
          for patch in tracking/patches/*pages*.yaml; do
            [ -e "$patch" ] && cargo run -p campbooks-tracking-plan -- apply "$patch"
          done
          true
      - name: Collect what changed
        run: |
          git status --short
          git diff --name-only > /tmp/changed.txt
          git ls-files --others --exclude-standard >> /tmp/changed.txt
          grep -v '^$' /tmp/changed.txt | sort -u > /tmp/changed-sorted.txt || true
          tar czf /tmp/regen-tracking.tgz -T /tmp/changed-sorted.txt || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: regen-tracking
          path: /tmp/regen-tracking.tgz
          retention-days: 3
          if-no-files-found: error
