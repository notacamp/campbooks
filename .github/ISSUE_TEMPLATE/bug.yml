name: Bug report
description: Something in Campbooks Next behaves incorrectly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: "Expected vs actual. No real personal data or emails." }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: Steps to reproduce }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version, description: "From /api/v1/system/version or the app's About screen" }
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [Web, macOS, Windows, Linux, iOS, Android, API] }
