# cargo-deny: advisories, licenses, bans and sources for the Rust workspace.
# https://embarkstudios.github.io/cargo-deny/
# The Tauri shell under clients/ is its own workspace and is checked separately.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
# Vulnerability and unsoundness advisories always fail (cargo-deny default).
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
# Only licences something in the graph actually needs; add more with a reason.
allow = [
    "MIT",                 # most of the ecosystem (often as MIT OR Apache-2.0)
    "Apache-2.0",          # rustls, aws-lc-rs, tokio-adjacent crates without an MIT option
    "BSD-3-Clause",        # aws-lc-sys (AND-combined), brotli/compression stack, subtle
    "ISC",                 # aws-lc-sys/aws-lc-rs (AWS-LC crypto, via rustls), untrusted
    "Unicode-3.0",         # ICU data/normalisation crates (via url -> idna)
    "Zlib",                # foldhash (via hashbrown <- sqlx-core)
    "CDLA-Permissive-2.0", # Mozilla CA root data: webpki-roots (sqlx), webpki-root-certs (reqwest)
]
exceptions = [
    # MPL-2.0 (file-level copyleft), used unmodified, only by the email HTML
    # sanitiser (ammonia, css-inline and its CSS filter, conversations):
    # Servo's CSS parser and selector matching. Scoped to these crates, not
    # allowed globally.
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    # 0BSD (public-domain-equivalent, no attribution even): the quoted-printable
    # encoder of lettre (the instance's own mail). Scoped to it.
    { crate = "quoted_printable", allow = ["0BSD"] },
    # BSD-2-Clause (permissive, attribution only, like the BSD-3-Clause
    # already allowed): the AMQP client stack under lapin (MIT), which the
    # tracked events relay publishes with (campbooks-cloud#321). Scoped to it.
    { crate = "amq-protocol", allow = ["BSD-2-Clause"] },
    { crate = "amq-protocol-tcp", allow = ["BSD-2-Clause"] },
    { crate = "amq-protocol-types", allow = ["BSD-2-Clause"] },
    { crate = "amq-protocol-uri", allow = ["BSD-2-Clause"] },
    { crate = "async-rs", allow = ["BSD-2-Clause"] },
    { crate = "rustls-connector", allow = ["BSD-2-Clause"] },
    { crate = "tcp-stream", allow = ["BSD-2-Clause"] },
]

[licenses.private]
# All workspace crates are `publish = false` under LicenseRef-Sustainable-Use;
# they are ours and need no allow-list entry.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # rustls everywhere: no OpenSSL / platform TLS stacks.
    { crate = "openssl", reason = "use rustls" },
    { crate = "openssl-sys", reason = "use rustls" },
    { crate = "native-tls", reason = "use rustls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
