# The Tauri shell is its OWN Cargo workspace (see `[workspace]` below) so the
# GUI/webview system dependencies never enter the server workspace or its CI.
[package]
name = "campbooks-app"
version = "0.1.0"
description = "Campbooks desktop and mobile shell (Tauri 2)"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Sustainable-Use"
repository = "https://github.com/notacamp/campbooks"
publish = false

[workspace]

[lib]
# `staticlib`/`cdylib` are what the iOS and Android builds link against.
name = "campbooks_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
# Opens links from mail in the system browser (never in a webview), from Rust
# only: nothing is exposed to the webview.
open = "5.4.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# rustls (aws-lc-rs provider) + the platform certificate verifier; no OpenSSL.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
url = "2.5.8"
thiserror = "2.0.21"

# Mirrors the server workspace's lint policy (root `Cargo.toml`).
[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
