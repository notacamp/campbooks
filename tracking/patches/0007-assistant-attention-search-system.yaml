  - { enum: "assistant.proposal_action", value: "not_needed", description: "Its need: Not needed." }
  - { enum: "assistant.proposal_action", value: "already_paid", description: "Its Pay need: Already paid." }
  - { enum: "assistant.proposal_action", value: "still_to_pay", description: "Its Pay need: Still to pay." }
  - { enum: "assistant.proposal_action", value: "yes_to_question", description: "Its question: Yes." }
  - { enum: "assistant.proposal_action", value: "later", description: "Its need: Later." }
  - { enum: "assistant.proposal_action", value: "task_done", description: "A task: done." }
  - { enum: "assistant.proposal_action", value: "task_not_needed", description: "A task: not needed after all." }
  - { enum: "assistant.proposal_action", value: "plan_day", description: "A task: planned for a day." }
  - { enum: "assistant.proposal_action", value: "task_later", description: "A task: Later." }
  - { enum: "assistant.proposal_action", value: "due", description: "A task: due on a day." }
  - { enum: "assistant.proposal_action", value: "hand_off", description: "A task: handed to a teammate." }
  - { enum: "assistant.proposal_action", value: "create_event", description: "A new calendar event." }
  - { enum: "assistant.proposal_action", value: "update_event", description: "Change an event." }
  - { enum: "assistant.proposal_action", value: "delete_event", description: "Delete an event." }
  - { enum: "assistant.proposal_action", value: "respond_event", description: "Answer an invitation." }
  - { enum: "assistant.proposal_action", value: "push_event", description: "Add an event to a provider calendar." }
  - { enum: "assistant.proposal_action", value: "unpush_event", description: "Take an event off a provider calendar." }
  - { enum: "assistant.proactivity", value: "ask_first", description: "Wait for a yes (the default)." }
  - { enum: "assistant.proactivity", value: "act_then_tell", description: "Start it and tell the member, with Undo." }
  - { enum: "assistant.profile_setting", value: "proactivity", description: "How Scout's own proposals start." }
  - { enum: "assistant.profile_setting", value: "asked", description: "Whether the member answered or put off the questions." }
  - { enum: "attention.reason", value: "review", description: "Look before acting: a warning, or a question." }
  - { enum: "attention.reason", value: "reply", description: "Someone is waiting for an answer." }
  - { enum: "attention.reason", value: "decide", description: "A choice is needed." }
  - { enum: "attention.reason", value: "do", description: "Something to do." }
  - { enum: "attention.reason", value: "pay", description: "Money is owed." }
  - { enum: "attention.reason", value: "nudge", description: "Someone the member waits on has not written by when they were expected to." }
  - { enum: "attention.reason", value: "worth_a_look", description: "A rule the member taught keeps it in front of them until they have opened it once." }
  - { enum: "attention.reason", value: "waiting", description: "The member waits on someone." }
  - { enum: "attention.trust", value: "sure", description: "The producing module asserts it." }
  - { enum: "attention.trust", value: "check", description: "It asks the member (a question)." }
  - { enum: "attention.item_state", value: "open", description: "It still needs someone." }
  - { enum: "attention.item_state", value: "cleared", description: "It no longer does." }
  - { enum: "system.ai_role", value: "decide", description: "Typed decisions about a state." }
  - { enum: "system.ai_role", value: "embed", description: "Text embeddings for search and similarity." }
  - { enum: "system.ai_role", value: "complete", description: "Longer free-form generation (drafts, summaries, Scout's answers)." }
  - { enum: "system.ai_role", value: "vision", description: "Understanding images and scanned documents." }
  - { enum: "kernel.job_state", value: "pending", description: "Waiting to run." }
  - { enum: "kernel.job_state", value: "running", description: "Claimed by a worker." }
  - { enum: "kernel.job_state", value: "failed", description: "Dead: out of attempts, or failed for good." }

coverage:
  - kind: "operation"
    name: "assistant.start_chat"
    events: [assistant.chat_started]
  - kind: "operation"
    name: "assistant.ask_chat"
    events: [assistant.chat_continued, assistant.answer_finished]
  - kind: "operation"
    name: "assistant.stream_chat"
    events: [assistant.chat_continued, assistant.answer_finished]
  - kind: "operation"
    name: "assistant.delete_chat"
    events: [assistant.chat_deleted]
  - kind: "operation"
    name: "assistant.settle_proposal"
    events: [assistant.proposal_confirmed, assistant.proposal_declined, assistant.proposal_undone]
  - kind: "operation"
    name: "assistant.update_profile"
    events: [assistant.profile_updated]
  - kind: "operation"
    name: "assistant.compile_instruction"
    exemption: "stores nothing: Scout proposes rules from a sentence, and a rule saved from them is tracked by conversations.create_rule"
  - kind: "handler"
    name: "assistant.schedule_workspace_purge"
    exemption: "projection of workspaces.workspace_deleted: it only schedules the purge"
  - kind: "handler"
    name: "assistant.forget_member"
    exemption: "consequence of workspaces.member_left, tracked there: the departed member's profile and chats go"
  - kind: "job"
    name: "assistant.purge_workspace"
    exemption: "maintenance: a deleted workspace's profiles and chats deleted; the deletion is tracked by workspaces"
  - kind: "schedule"
    name: "assistant.dispatch_expire_chats"
    exemption: "maintenance, no action of anyone: only enqueues the jobs that do the work"
  - kind: "job"
    name: "assistant.expire_chats"
    exemption: "maintenance, no action of anyone: chats 30 days past their last message deleted with their messages (retention, not anyone's request)"
  - kind: "operation"
    name: "attention.snooze"
    events: [attention.item_snoozed]
  - kind: "operation"
    name: "attention.unsnooze"
    events: [attention.item_unsnoozed]
  - kind: "handler"
    name: "attention.project_conversation_need"
    exemption: "projection of conversations.need_changed: one item per conversation's need (a new message from the sender ends its Laters)"
  - kind: "handler"
    name: "attention.project_task"
    exemption: "projection of tasks.task_changed: one item per task"
  - kind: "handler"
    name: "attention.schedule_workspace_purge"
    exemption: "projection of workspaces.workspace_deleted: it only schedules the purge"
  - kind: "handler"
    name: "attention.forget_member"
    exemption: "consequence of workspaces.member_left, tracked there: the departed member's Laters go"
  - kind: "handler"
    name: "attention.forget_inbox"
    exemption: "consequence of conversations.inbox_closed, tracked there: the removed inbox's items and their Laters go"
  - kind: "job"
    name: "attention.purge_workspace"
    exemption: "maintenance: a deleted workspace's items deleted; the deletion is tracked by workspaces"
  - kind: "handler"
    name: "search.on_message_received"
    exemption: "projection of conversations.message_received: the conversation's entries in the index refreshed"
  - kind: "handler"
    name: "search.on_message_sent"
    exemption: "projection of conversations.message_sent: the conversation's entries in the index refreshed"
  - kind: "handler"
    name: "search.on_conversation_changed"
    exemption: "projection of conversations.conversation_changed: the conversation's entries in the index refreshed"
  - kind: "handler"
    name: "search.on_inbox_removed"
    exemption: "projection of conversations.inbox_removed (tracked as conversations.inbox_closed): the inbox's entries go"
  - kind: "handler"
    name: "search.schedule_workspace_purge"
    exemption: "projection of workspaces.workspace_deleted: it only stops indexing and schedules the purge"
  - kind: "job"
    name: "search.purge_workspace"
    exemption: "maintenance: a deleted workspace's index deleted; the deletion is tracked by workspaces"
  - kind: "job"
    name: "search.backfill"
    exemption: "projection: a workspace's index built from its sources a page at a time; no action of anyone"
  - kind: "operation"
    name: "system.report_client_telemetry"
    exemption: "telemetry itself: the app's error and timing reports, forwarded scrubbed to the operator's collector and never stored; tracking them would record them twice"
  - kind: "operation"
    name: "system.report_screen_view"
    exemption: "telemetry itself: a screen the app shows, relayed to the operator's usage analytics and never stored; tracking it would record it twice"
  - kind: "operation"
    name: "system.admin_retry_job"
    events: [kernel.job_retried]
  - kind: "operation"
    name: "system.admin_retry_jobs"
    events: [kernel.jobs_retried]
  - kind: "operation"
    name: "system.admin_discard_job"
    events: [kernel.job_discarded]
  - kind: "operation"
    name: "system.admin_discard_schedule_run"
    events: [kernel.schedule_run_discarded]
