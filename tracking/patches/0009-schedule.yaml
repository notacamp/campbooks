# The schedule module's tracked events (campbooks-cloud#349, OpenSpec change
# track-schedule-events): events of a calendar made, edited, moved,
# cancelled, deleted, restored, answered, added to a provider calendar and
# taken away again; calendars added by a grant, turned on and off,
# recoloured and removed with their connection; settings updated; one
# summary per batch of a provider's changes applied. How a change ends at
# the provider is connectors' (connectors.calendar_change_completed). Every
# mutating operation, job and event handler of the module gets a Coverage
# row. Applied with
# `cargo run -p campbooks-tracking-plan -- apply tracking/patches/0009-schedule.yaml`.
changelog:
  - date: "2026-10-25"
    plan_version: 9
    change: "The schedule module instrumented (campbooks-cloud#349): 16 events for events of a calendar created, edited (which fields), moved (the times before), cancelled by a later email, deleted, restored, answered (the answer before), pushed to a provider calendar and unpushed, calendars added by a grant, enabled, disabled, recoloured and removed with their connection, settings updated (which settings), and one summary per batch of a provider's changes applied (counts); records calendar_event, calendar_event_times, calendar and settings; Coverage for every operation, job and handler of the module, apply_outcome and release_delete naming connectors.calendar_change_completed."
    pr: "#663"

events:
  - name: "schedule.calendar_event_created"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "created"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation, system]
    description: "An event was added to a member's calendar: made by the member, or read by Scout from an email in their own inbox. Never its title, place or notes."
    fires_when: "schedule.create_event makes it, or schedule.add_read_items adds an item of a read to the inbox owner's Campbooks calendar, in the transaction that inserts it. The provider's events are counted by schedule.provider_changes_applied."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_edited"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "edited"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation, system]
    description: "An event changed other than in its times: which fields, never their values (the kind is in the snapshot, and before_kind when it changed). A change of times is schedule.calendar_event_moved."
    fires_when: "schedule.update_event changes at least one field other than the times (of an event, or of one occurrence: its exception), or schedule.add_read_items changes an event a later email updates or links an invitation already on a calendar to its email, in the transaction of the change; the same values again track nothing."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_moved"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "moved"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation, system]
    description: "An event's start or end changed (or it became all-day, or timed); before is its times as they were."
    fires_when: "schedule.update_event, or schedule.add_read_items for a later email that updates it, changes its times, in the transaction of the change; the same times again track nothing."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_cancelled"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "cancelled"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "An event Scout added was cancelled by a later email: it stays, cancelled."
    fires_when: "schedule.add_read_items applies an item that cancels an earlier one whose event stands, in the transaction that cancels it; one cancelled or deleted already tracks nothing."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_deleted"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "deleted"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation]
    description: "A member deleted an event (a series whole). It is hidden at once and can be undone for a short time; on a provider calendar the delete reaches the provider after that (connectors.calendar_change_completed)."
    fires_when: "schedule.delete_event marks it deleted, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_restored"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "restored"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation]
    description: "A deleted event was brought back (the undo of a delete). remade_at_provider says the delete had reached the provider, so the event is made there again."
    fires_when: "schedule.restore_event brings it back, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_responded"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "responded"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation]
    description: "A member answered an invitation (accepted, maybe, declined, or back to not answered); before is the answer they had."
    fires_when: "schedule.respond_event stores another answer than the one the event had, in that transaction; the same answer again tracks nothing."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_pushed"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "pushed"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation, system]
    description: "An event of a member's Campbooks calendar was copied to one of their provider calendars (Add to my calendar); the snapshot is the copy, whose pushed_from_id is the Campbooks event, now hidden."
    fires_when: "schedule.push_event, or schedule.add_read_items for a kind the member set an also-add-to calendar for, makes the copy and asks connectors to make it there, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_event_unpushed"
    version: 1
    module: "schedule"
    object: "calendar_event"
    action: "unpushed"
    scope: "workspace"
    status: "live"
    actor_types: [user, assistant, automation]
    description: "A copy on a provider calendar was taken away again; the snapshot is the Campbooks event, shown again."
    fires_when: "schedule.unpush_event deletes the copy and asks connectors to delete it there, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_added"
    version: 1
    module: "schedule"
    object: "calendar"
    action: "added"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A calendar grant brought the member a calendar of the provider account: the primary one is on, the others wait for the member. Never its name or colour."
    fires_when: "schedule.grant_calendars makes a calendar the module did not have, in the job's transaction; one per calendar."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_enabled"
    version: 1
    module: "schedule"
    object: "calendar"
    action: "enabled"
    scope: "workspace"
    status: "live"
    actor_types: [user]
    description: "A member turned a calendar on: its events sync and show."
    fires_when: "schedule.update_calendar sets syncing on a calendar that was off, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_disabled"
    version: 1
    module: "schedule"
    object: "calendar"
    action: "disabled"
    scope: "workspace"
    status: "live"
    actor_types: [user]
    description: "A member turned a calendar off: its events stop syncing and show nothing."
    fires_when: "schedule.update_calendar clears syncing on a calendar that was on, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_recoloured"
    version: 1
    module: "schedule"
    object: "calendar"
    action: "recoloured"
    scope: "workspace"
    status: "live"
    actor_types: [user]
    description: "A member changed a calendar's colour (or cleared it). Never the colour."
    fires_when: "schedule.update_calendar stores another colour than the calendar had, in that transaction."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.calendar_removed"
    version: 1
    module: "schedule"
    object: "calendar"
    action: "removed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A provider calendar was deleted with its events because its connection was removed (connectors.connection_removed); the snapshot is the calendar as it stood."
    fires_when: "schedule.forget_connection deletes it, in the job's transaction; one per calendar. A departed member's and a deleted workspace's calendars are not tracked (workspaces.member_left, workspaces.workspace_deleted are)."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.settings_updated"
    version: 1
    module: "schedule"
    object: "settings"
    action: "updated"
    scope: "workspace"
    status: "live"
    actor_types: [user]
    description: "A member changed their calendar settings: which ones, never their values (no time zone, no hours)."
    fires_when: "schedule.update_settings changes at least one setting, in that transaction; the same values again track nothing."
    added_in: 9
    openspec_change: "track-schedule-events"
  - name: "schedule.provider_changes_applied"
    version: 1
    module: "schedule"
    object: "provider_changes"
    action: "applied"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A batch of a provider calendar's changes was applied to the member's calendar: one summary per batch, with counts, never the events. connectors.stream_synced is the run that read it."
    fires_when: "schedule.apply_calendar_changes creates, changes or cancels at least one event, in the job's transaction; a batch for a calendar that is off, or one that changes nothing, tracks nothing."
    added_in: 9
    openspec_change: "track-schedule-events"

