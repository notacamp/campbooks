  - { enum: "schedule.calendar_source", value: "campbooks", description: "The member's own Campbooks calendar: no provider sees it." }
  - { enum: "schedule.calendar_source", value: "provider", description: "A calendar of a connected provider account." }
  - { enum: "schedule.provider", value: "google", description: "Google Calendar." }
  - { enum: "schedule.provider", value: "zoho", description: "Zoho Calendar." }
  - { enum: "schedule.calendar_change", value: "create", description: "Make the event at the provider." }
  - { enum: "schedule.calendar_change", value: "update", description: "Change the event there." }
  - { enum: "schedule.calendar_change", value: "update_occurrence", description: "Change one occurrence of a series there." }
  - { enum: "schedule.calendar_change", value: "delete", description: "Delete the event there." }
  - { enum: "schedule.calendar_change", value: "respond", description: "Send the member's answer." }
  - { enum: "schedule.event_field", value: "title", description: "Its title." }
  - { enum: "schedule.event_field", value: "kind", description: "Its kind." }
  - { enum: "schedule.event_field", value: "place", description: "Where it is." }
  - { enum: "schedule.event_field", value: "notes", description: "Its notes." }
  - { enum: "schedule.event_field", value: "time_zone", description: "The time zone it is written in." }
  - { enum: "schedule.event_field", value: "busy", description: "Whether it counts for free time." }
  - { enum: "schedule.event_field", value: "status", description: "Whether it stands (a later email confirming it)." }
  - { enum: "schedule.event_field", value: "source", description: "The email it is linked to." }
  - { enum: "schedule.settings_field", value: "time_zone", description: "The time zone, chosen by the member." }
  - { enum: "schedule.settings_field", value: "device_time_zone", description: "The time zone, taken from the device because the member had none." }
  - { enum: "schedule.settings_field", value: "working_hours", description: "The working hours." }
  - { enum: "schedule.settings_field", value: "scout_kinds", description: "The kinds Scout adds." }
  - { enum: "schedule.settings_field", value: "also_add_to", description: "Per kind, the calendar an event is also added to." }

coverage:
  - kind: "operation"
    name: "schedule.create_event"
    events: [schedule.calendar_event_created]
  - kind: "operation"
    name: "schedule.update_event"
    events: [schedule.calendar_event_edited, schedule.calendar_event_moved]
  - kind: "operation"
    name: "schedule.delete_event"
    events: [schedule.calendar_event_deleted]
  - kind: "operation"
    name: "schedule.restore_event"
    events: [schedule.calendar_event_restored]
  - kind: "operation"
    name: "schedule.respond_event"
    events: [schedule.calendar_event_responded]
  - kind: "operation"
    name: "schedule.push_event"
    events: [schedule.calendar_event_pushed]
  - kind: "operation"
    name: "schedule.unpush_event"
    events: [schedule.calendar_event_unpushed]
  - kind: "operation"
    name: "schedule.update_calendar"
    events: [schedule.calendar_enabled, schedule.calendar_disabled, schedule.calendar_recoloured]
  - kind: "operation"
    name: "schedule.update_settings"
    events: [schedule.settings_updated]
  - kind: "handler"
    name: "schedule.grant_calendars"
    events: [schedule.calendar_added]
  - kind: "handler"
    name: "schedule.apply_calendar_changes"
    events: [schedule.provider_changes_applied]
  # How a member's change ended at the provider is tracked by connectors in
  # the transaction that publishes it; this handler applies that ending.
  - kind: "handler"
    name: "schedule.apply_outcome"
    events: [connectors.calendar_change_completed]
  - kind: "handler"
    name: "schedule.add_read_items"
    events: [schedule.calendar_event_created, schedule.calendar_event_edited, schedule.calendar_event_moved, schedule.calendar_event_cancelled, schedule.calendar_event_pushed]
  - kind: "handler"
    name: "schedule.forget_connection"
    events: [schedule.calendar_removed]
  - kind: "handler"
    name: "schedule.forget_member"
    exemption: "consequence of workspaces.member_left, tracked there: the departed member's calendars, events and settings go"
  - kind: "handler"
    name: "schedule.schedule_workspace_purge"
    exemption: "projection of workspaces.workspace_deleted: it only schedules the purge"
  # The member's delete is schedule.calendar_event_deleted; this asks for it
  # at the provider once the undo window passed, and connectors tracks how it
  # ends.
  - kind: "job"
    name: "schedule.release_delete"
    events: [connectors.calendar_change_completed]
  - kind: "job"
    name: "schedule.purge_workspace"
    exemption: "maintenance: a deleted workspace's calendars and events deleted; the deletion is tracked by workspaces"
  - kind: "job"
    name: "schedule.retag_bindings"
    exemption: "maintenance, no action of anyone: MACs of waiting calendar change requests re-tagged after a key rotation"
