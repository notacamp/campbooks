# Coverage is required (campbooks-cloud#332, OpenSpec change
# require-full-tracking-coverage): the rows still missing on next. An IMAP
# mailbox's address check asked for again (connectors.check_address) and its
# message sent or not (connectors.send_address_check), both from
# campbooks-cloud#314; and the kernel's own maintenance, which no module
# owned. Applied with
# `cargo run -p campbooks-tracking-plan -- apply tracking/patches/0011-coverage-gaps.yaml`.
changelog:
  - date: "2026-10-25"
    plan_version: 11
    change: "Coverage required with no baseline (campbooks-cloud#332): 2 connectors events for an IMAP mailbox's address check asked for again and its message sent or not (with why); Coverage rows for connectors.check_address, connectors.send_address_check and the kernel's maintenance schedules and change-feed sequencer."
    pr: "#666"

events:
  - name: "connectors.address_check_requested"
    version: 1
    module: "connectors"
    object: "address_check"
    action: "requested"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "Someone asked for an IMAP mailbox's address to be checked again: a new one-time code is sent to the address through the mailbox's own server. Never the address or the code."
    fires_when: "connectors.check_address starts a new check of a mailbox whose address is not verified, in the transaction that starts it; asking while a check is under way, or being refused (not needed, needs reauth, IMAP off, the day's checks spent), tracks nothing."
    added_in: 11
    openspec_change: "require-full-tracking-coverage"
  - name: "connectors.address_check_send_completed"
    version: 1
    module: "connectors"
    object: "address_check_send"
    action: "completed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "The message of an IMAP mailbox's address check went out (its stream's runs look for it from now on), or could not be sent and the check ended unverified; reason is the kind of failure, never the server's reply."
    fires_when: "connectors.send_address_check marks the check sent, or ends it failed, in the job's transaction; a check sent, ended or replaced meanwhile, a connection gone, or an address already verified tracks nothing, and a busy server tried again later is not an event."
    added_in: 11
    openspec_change: "require-full-tracking-coverage"

properties:
  - { event: "connectors.address_check_requested", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The connection whose address is checked (address_verified false)." }
  - { event: "connectors.address_check_send_completed", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The connection whose address is checked." }
  - { event: "connectors.address_check_send_completed", version: 1, property: "outcome", type: "enum", of: "connectors.address_check_send_outcome", required: true, classification: "operational", description: "Whether the check's message went out." }
  - { event: "connectors.address_check_send_completed", version: 1, property: "reason", type: "enum", of: "connectors.address_check_reason", required: false, classification: "operational", description: "Why it could not be sent, when it was not." }

enums:
  - { enum: "connectors.address_check_send_outcome", value: "sent", description: "The mailbox's SMTP server took the message (or may have): the runs look for its code." }
  - { enum: "connectors.address_check_send_outcome", value: "failed", description: "It could not be sent; the check ended unverified and can be asked for again." }
  - { enum: "connectors.address_check_reason", value: "provider_not_configured", description: "IMAP is not turned on on this instance." }
  - { enum: "connectors.address_check_reason", value: "address_changed", description: "The connection's address is no longer the one the check was for." }
  - { enum: "connectors.address_check_reason", value: "needs_reauth", description: "The mailbox's password could not be used: the member must connect it again." }
  - { enum: "connectors.address_check_reason", value: "not_connected", description: "The mailbox's SMTP server or its messages stream is not stored." }
  - { enum: "connectors.address_check_reason", value: "address_invalid", description: "The address cannot be sent to as it is." }
  - { enum: "connectors.address_check_reason", value: "address_refused", description: "The SMTP server would not send from or to the address." }
  - { enum: "connectors.address_check_reason", value: "smtp_login_refused", description: "The SMTP server refused the mailbox's password." }
  - { enum: "connectors.address_check_reason", value: "smtp_unavailable", description: "The SMTP server could not be used safely, or did not take the message in the attempts allowed." }
  - { enum: "connectors.address_check_reason", value: "other", description: "A reason this plan does not know yet." }

coverage:
  - kind: "operation"
    name: "connectors.check_address"
    events: [connectors.address_check_requested]
  - kind: "job"
    name: "connectors.send_address_check"
    events: [connectors.address_check_send_completed]
  # The kernel's own background work.
  - kind: "schedule"
    name: "kernel.prune_jobs"
    exemption: "maintenance, no action of anyone: finished jobs past their retention deleted"
  - kind: "schedule"
    name: "kernel.prune_events"
    exemption: "maintenance, no action of anyone: domain events past their retention deleted, never one still being delivered"
  - kind: "schedule"
    name: "kernel.prune_tracked_events"
    exemption: "maintenance, no action of anyone: tracked events already published deleted from the outbox"
  - kind: "schedule"
    name: "kernel.sweep_blobs"
    exemption: "maintenance, no action of anyone: blobs no record references, and abandoned uploads, deleted after their grace period"
  - kind: "schedule"
    name: "kernel.prune_idempotency"
    exemption: "maintenance, no action of anyone: expired idempotency keys deleted"
  - kind: "schedule"
    name: "kernel.prune_rate_limits"
    exemption: "maintenance, no action of anyone: rate-limit counters whose window ended deleted"
  - kind: "schedule"
    name: "kernel.prune_changes"
    exemption: "maintenance, no action of anyone: change-feed entries past their retention deleted"
  - kind: "schedule"
    name: "kernel.sweep_purged_workspaces"
    exemption: "maintenance: what reached the kernel's tables of a purged workspace after its purge deleted; the purge is tracked as workspaces.workspace_purged"
  - kind: "schedule"
    name: "kernel.dispatch_rekeys"
    exemption: "maintenance, no action of anyone: only enqueues the modules' re-tag jobs while a previous key is set, which have their own rows"
  - kind: "job"
    name: "kernel.sequence_changes"
    exemption: "projection: numbers a workspace's change-feed entries for clients to follow; the changes are tracked by the modules that make them"
