    name: "conversations.write_reply"
    exemption: "stores nothing: Scout proposes text, and a draft made from it is tracked by conversations.create_draft"
  - kind: "operation"
    name: "conversations.stream_reply"
    exemption: "stores nothing: Scout proposes text, and a draft made from it is tracked by conversations.create_draft"
  - kind: "operation"
    name: "conversations.suggest_replies"
    exemption: "stores nothing: Scout proposes text, and a draft made from it is tracked by conversations.create_draft"
  - kind: "operation"
    name: "conversations.write_nudge"
    exemption: "stores nothing: Scout proposes text, and a draft made from it is tracked by conversations.create_draft"
  - kind: "job"
    name: "conversations.refresh_need"
    exemption: "derived state: a need worked out again from stored messages and answers (conversations.need_changed); no action of anyone"
  - kind: "job"
    name: "conversations.wake_needs"
    exemption: "derived state: a need worked out again from stored messages and answers (conversations.need_changed); no action of anyone"
  - kind: "job"
    name: "conversations.backfill_needs"
    exemption: "derived state: a need worked out again from stored messages and answers (conversations.need_changed); no action of anyone"
  - kind: "job"
    name: "conversations.notice_rules"
    exemption: "derived state: suggestions recounted from recent mail; answering one is tracked"
  - kind: "job"
    name: "conversations.fill_templates"
    exemption: "maintenance, no action of anyone: subject templates filled in for older mail"
  - kind: "job"
    name: "conversations.resign_rules"
    exemption: "maintenance, no action of anyone: rules that predate bindings signed once"
  - kind: "job"
    name: "conversations.retag_bindings"
    exemption: "maintenance, no action of anyone: MACs re-tagged after a key rotation"
  - kind: "job"
    name: "conversations.purge_workspace"
    exemption: "maintenance: a deleted workspace's rows deleted; the deletion is tracked by workspaces"
  - kind: "schedule"
    name: "conversations.dispatch_need_clocks"
    exemption: "maintenance, no action of anyone: only enqueues the jobs that do the work"
  - kind: "schedule"
    name: "conversations.dispatch_needs_backfills"
    exemption: "maintenance, no action of anyone: only enqueues the jobs that do the work"
  - kind: "schedule"
    name: "conversations.dispatch_rule_resigns"
    exemption: "maintenance, no action of anyone: only enqueues the jobs that do the work"
  - kind: "handler"
    name: "conversations.ingest_messages"
    exemption: "only enqueues conversations.apply_changes, which tracks"
  - kind: "handler"
    name: "conversations.forget_member"
    exemption: "consequence of workspaces.member_left, tracked there: the departed member's own rows go"
  - kind: "handler"
    name: "conversations.pause_suspended_author"
    exemption: "projection of workspaces.member_suspended: nothing on the rules changes"
  - kind: "handler"
    name: "conversations.resume_unsuspended_author"
    exemption: "projection of workspaces.member_unsuspended: nothing on the rules changes"
  - kind: "handler"
    name: "conversations.schedule_workspace_purge"
    exemption: "projection of workspaces.workspace_deleting: it only schedules the purge"
