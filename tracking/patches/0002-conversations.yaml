# The conversations module's tracked events (campbooks-cloud#325, OpenSpec
# change track-conversations-events): every operation, job, schedule and event handler of the
# module gets a Coverage row. Applied with
# `cargo run -p campbooks-tracking-plan -- apply tracking/patches/0002-conversations.yaml`.
changelog:
  - date: "2026-10-24"
    plan_version: 2
    change: "The conversations module instrumented (campbooks-cloud#325): 40 events for flags, streams, labels, needs, drafts and sends, taught rules and their runs, suggestions, person notes, provider batches, the model pass, Scout's reads and inboxes; records draft, need, rule and rule_run; Coverage for every operation, job, schedule and handler of the module."
    pr: ""

events:
  - name: "conversations.conversation_read"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "read"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation was marked read."
    fires_when: "Marking it read changes at least one of its messages (conversations.mark_read), in the transaction of that change. A conversation already read tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_unread_marked"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "unread_marked"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation was marked unread."
    fires_when: "Marking it unread changes its newest message (conversations.mark_unread). One already unread tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_starred"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "starred"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation was starred."
    fires_when: "Starring it stars its newest message (conversations.star). One already starred tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_unstarred"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "unstarred"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation was unstarred."
    fires_when: "Unstarring it changes at least one of its messages (conversations.unstar). One with no star tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_trashed"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "trashed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation went to the trash."
    fires_when: "Trashing it changes at least one of its messages (conversations.trash). One already in the trash tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_untrashed"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "untrashed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation came out of the trash, back where it was."
    fires_when: "Taking it out of the trash changes at least one of its messages (conversations.untrash)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_spammed"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "spammed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation was reported as spam: out of the inbox, into spam."
    fires_when: "Reporting it changes at least one of its messages (conversations.report_spam). One already in spam tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_unspammed"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "unspammed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A conversation was taken out of spam (Not spam): received mail back in the inbox."
    fires_when: "Taking it out of spam changes at least one of its messages (conversations.not_spam)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_moved"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "moved"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A member moved a conversation to another stream."
    fires_when: "Moving it changes its stream (conversations.move_to_stream); the move is recorded as a correction. A move to the stream it is in tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_labelled"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "labelled"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A label was put on a conversation."
    fires_when: "Adding the label links it to the conversation (conversations.add_label). A label already on it tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.conversation_unlabelled"
    version: 1
    module: "conversations"
    object: "conversation"
    action: "unlabelled"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A label was taken off a conversation."
    fires_when: "Removing the label unlinks it (conversations.remove_label)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.need_resolved"
    version: 1
    module: "conversations"
    object: "need"
    action: "resolved"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A member gave a verdict on what a conversation needs: done, not needed, already paid or still to pay."
    fires_when: "The verdict is stored (conversations.resolve_need), in the transaction that works the need out again. Still to pay on a need that was no question changes nothing and tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.need_confirmed"
    version: 1
    module: "conversations"
    object: "need"
    action: "confirmed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A member answered yes to the question a conversation's need asked."
    fires_when: "The yes is stored (conversations.confirm_need)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.need_reopened"
    version: 1
    module: "conversations"
    object: "need"
    action: "reopened"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A member took back their verdict on a conversation's need (Undo)."
    fires_when: "The verdict is taken back (conversations.reopen_need)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_created"
    version: 1
    module: "conversations"
    object: "draft"
    action: "created"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A draft was started: new, a reply, a reply all, a forward or a nudge."
    fires_when: "The draft is stored (conversations.create_draft)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_updated"
    version: 1
    module: "conversations"
    object: "draft"
    action: "updated"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A draft was saved with a change."
    fires_when: "A save changes its recipients, subject, text, quoted history, attachments, or makes a failed draft a draft again (conversations.update_draft). A save that changes nothing tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_discarded"
    version: 1
    module: "conversations"
    object: "draft"
    action: "discarded"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A draft was discarded."
    fires_when: "The draft is deleted (conversations.delete_draft)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_scheduled"
    version: 1
    module: "conversations"
    object: "draft"
    action: "scheduled"
    scope: "workspace"
    status: "live"
    actor_types: [user, client]
    description: "A member sent a draft: it waits out its undo window."
    fires_when: "The send is scheduled (conversations.send_draft)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_unscheduled"
    version: 1
    module: "conversations"
    object: "draft"
    action: "unscheduled"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, system]
    description: "A scheduled send was taken back: a draft again."
    fires_when: "A member cancels it during its undo window (conversations.cancel_send), or the release finds its author may no longer send from the inbox (conversations.release_send). A draft not scheduled tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_released"
    version: 1
    module: "conversations"
    object: "draft"
    action: "released"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A scheduled send was handed to the connector."
    fires_when: "Its undo window passed and the release marks it sending (conversations.release_send)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_sent"
    version: 1
    module: "conversations"
    object: "draft"
    action: "sent"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "The provider sent a draft."
    fires_when: "The connector reports it sent (conversations.record_send, on connectors.send_completed), before the draft is deleted."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.draft_send_failed"
    version: 1
    module: "conversations"
    object: "draft"
    action: "send_failed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A send failed: the draft is editable and sendable again."
    fires_when: "The connector reports it failed (conversations.record_send), or no report came back in time (conversations.check_send, unknown_outcome)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_created"
    version: 1
    module: "conversations"
    object: "rule"
    action: "created"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "A taught rule was stored: acting, or proposed for a member's yes."
    fires_when: "The rule is stored (conversations.create_rule)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_confirmed"
    version: 1
    module: "conversations"
    object: "rule"
    action: "confirmed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client]
    description: "A member said yes to a rule: it acts with their rights."
    fires_when: "A proposal is kept, or a kept rule is bound again (conversations.confirm_rule)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_declined"
    version: 1
    module: "conversations"
    object: "rule"
    action: "declined"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A member turned a proposed rule down."
    fires_when: "The proposal is removed (conversations.decline_rule)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_updated"
    version: 1
    module: "conversations"
    object: "rule"
    action: "updated"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A rule was changed: reshaped, paused, resumed or adopted."
    fires_when: "The rule is saved (conversations.update_rule)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_removed"
    version: 1
    module: "conversations"
    object: "rule"
    action: "removed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A rule was removed."
    fires_when: "A member removes it (conversations.remove_rule), or a rule created, confirmed, updated or restored replaces it (cause replaced), in that transaction."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_restored"
    version: 1
    module: "conversations"
    object: "rule"
    action: "restored"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant]
    description: "A removed rule was brought back (Undo)."
    fires_when: "The rule is restored (conversations.restore_rule)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_run_finished"
    version: 1
    module: "conversations"
    object: "rule_run"
    action: "finished"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A run applying a rule to an inbox's mail, or putting it back, ended."
    fires_when: "The run ends, done or cancelled (conversations.apply_rule), in the transaction of its last batch. One event per run, with its counts: a run touches a whole inbox."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_notice_answered"
    version: 1
    module: "conversations"
    object: "rule_notice"
    action: "answered"
    scope: "workspace"
    status: "live"
    actor_types: [user, client]
    description: "A member answered a Scout-noticed suggestion: not now, or never."
    fires_when: "The answer is stored (conversations.answer_rule_notice)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_notice_answer_cleared"
    version: 1
    module: "conversations"
    object: "rule_notice"
    action: "answer_cleared"
    scope: "workspace"
    status: "live"
    actor_types: [user, client]
    description: "A member took back their answer to a suggestion (Undo): it is offered again."
    fires_when: "An answer is deleted (conversations.clear_rule_notice_answer). No answer to take back tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.rule_suggestion_dismissed"
    version: 1
    module: "conversations"
    object: "rule_suggestion"
    action: "dismissed"
    scope: "workspace"
    status: "live"
    actor_types: [user, client]
    description: "A member turned down the rules suggested after acting on a conversation."
    fires_when: "The dismissal is stored (conversations.dismiss_rule_suggestion). Only a member's own dismissal is stored."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.person_note_saved"
    version: 1
    module: "conversations"
    object: "person_note"
    action: "saved"
    scope: "workspace"
    status: "live"
    actor_types: [user]
    description: "A member saved what they told Scout about a person."
    fires_when: "A note is created or its text changed (conversations.set_person_note). The same text again tracks nothing. Never the note, nor whom it is about."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.person_note_deleted"
    version: 1
    module: "conversations"
    object: "person_note"
    action: "deleted"
    scope: "workspace"
    status: "live"
    actor_types: [user]
    description: "A member deleted a note about a person."
    fires_when: "The note is deleted (conversations.delete_person_note)."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.message_batch_applied"
    version: 1
    module: "conversations"
    object: "message_batch"
    action: "applied"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A batch of the provider's message changes was applied to an inbox."
    fires_when: "Applying it adds, changes or removes at least one message (conversations.apply_changes). A batch that changes nothing tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.message_decided"
    version: 1
    module: "conversations"
    object: "message"
    action: "decided"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "The model pass answered the triage questions about an inbound message."
    fires_when: "Its answers are stored (conversations.decide_message as mail arrives, conversations.decide_backlog for stored mail). A pass that stores nothing (no model, over the daily limit, already answered) tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.message_read_requested"
    version: 1
    module: "conversations"
    object: "message_read"
    action: "requested"
    scope: "workspace"
    status: "live"
    actor_types: [user, client]
    description: "A member opened a message and Scout's read of it was queued."
    fires_when: "The read is queued (conversations.request_message_read). Anything else it answers (already read, queued, not flagged, unavailable) tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.message_read_completed"
    version: 1
    module: "conversations"
    object: "message_read"
    action: "completed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A read of a message was stored: the sender's own structured data, or Scout's read."
    fires_when: "The read is stored (conversations.read_structured, conversations.read_message). Never what it read: counts only."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.inbox_created"
    version: 1
    module: "conversations"
    object: "inbox"
    action: "created"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "An inbox was created for a connection that gained the messages capability."
    fires_when: "The inbox is created (conversations.create_inbox, on connectors.capability_granted). A replay or an inbox already there tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"
  - name: "conversations.inbox_closed"
    version: 1
    module: "conversations"
    object: "inbox"
    action: "closed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A removed connection's inbox was deleted with its mail, or kept read-only."
    fires_when: "The inbox is deleted or frozen (conversations.forget_connection, on connectors.connection_removed). An inbox already gone or frozen tracks nothing."
    added_in: 2
    openspec_change: "track-conversations-events"

properties:
  - event: "conversations.conversation_read"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_unread_marked"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_starred"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_unstarred"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_trashed"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_untrashed"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_spammed"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_unspammed"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_moved"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_moved"
    version: 1
    property: "before"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation before the move: the stream it left and who had placed it there."
  - event: "conversations.conversation_labelled"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_labelled"
    version: 1
    property: "label_id"
    type: "id"
    required: true
    classification: "id"
    description: "The label (its name is never tracked)."
  - event: "conversations.conversation_labelled"
    version: 1
    property: "label_created"
    type: "bool"
    required: true
    classification: "operational"
    description: "Whether the inbox's label was created by this request."
  - event: "conversations.conversation_unlabelled"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.conversation_unlabelled"
    version: 1
    property: "label_id"
    type: "id"
    required: true
    classification: "id"
    description: "The label."
  - event: "conversations.need_resolved"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.need_resolved"
    version: 1
    property: "need"
    type: "record"
    of: "conversations.need"
    required: false
    classification: "operational"
    description: "Its need afterwards; absent when it has none."
  - event: "conversations.need_confirmed"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.need_confirmed"
    version: 1
    property: "need"
    type: "record"
    of: "conversations.need"
    required: false
    classification: "operational"
    description: "Its need afterwards; absent when it has none."
  - event: "conversations.need_reopened"
    version: 1
    property: "conversation"
    type: "record"
    of: "conversations.conversation"
    required: true
    classification: "operational"
    description: "The conversation afterwards."
  - event: "conversations.need_reopened"
    version: 1
    property: "need"
    type: "record"
    of: "conversations.need"
    required: false
    classification: "operational"
    description: "Its need afterwards; absent when it has none."
  - event: "conversations.draft_created"
    version: 1
    property: "draft"
    type: "record"
    of: "conversations.draft"
    required: true
