# Invitations awaiting an answer as Decide items on Home (campbooks-cloud#360,
# OpenSpec change home-invitations). No new tracked event: answering is
# schedule.respond_event, which already tracks schedule.calendar_event_responded.
# Coverage for what the change adds: the job that gives an answer to the
# provider once its undo window has passed (its outcome is connectors'
# calendar_change_completed, as for release_delete), the one-off backfill's
# dispatcher and job, and attention's projection of schedule.invitation_changed.
# Applied with
# `cargo run -p campbooks-tracking-plan -- apply tracking/patches/0014-home-invitations.yaml`.
changelog:
  - date: "2026-10-25"
    plan_version: 14
    change: "Invitations awaiting an answer on Home (campbooks-cloud#360): Coverage for schedule.release_response (connectors.calendar_change_completed), schedule.dispatch_invitation_backfills, schedule.announce_invitations and attention.project_invitation; no new event."
    pr: "#676"

coverage:
  - kind: "job"
    name: "schedule.release_response"
    events: [connectors.calendar_change_completed]
  - kind: "schedule"
    name: "schedule.dispatch_invitation_backfills"
    exemption: "maintenance, no action of anyone: only enqueues the jobs that do the work"
  - kind: "job"
    name: "schedule.announce_invitations"
    exemption: "maintenance, no action of anyone: invitations stored before announced once"
  - kind: "handler"
    name: "attention.project_invitation"
    exemption: "projection of schedule.invitation_changed: one Decide item per invitation awaiting an answer"
