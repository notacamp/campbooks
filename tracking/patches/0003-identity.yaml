    description: "Whether a later authorization may skip the screen."
  - record: "identity.consent"
    field: "granted_at"
    type: "timestamp"
    required: true
    classification: "operational"
    description: "When it was given."
  - record: "identity.consent"
    field: "revoked_at"
    type: "timestamp"
    required: false
    classification: "operational"
    description: "When it was revoked, if it was."

enums:
  - { enum: "identity.provider", value: "google", description: "Google." }
  - { enum: "identity.provider", value: "microsoft", description: "Microsoft 365 (work or school)." }
  - { enum: "identity.provider", value: "zoho", description: "Zoho." }
  - { enum: "identity.sign_in_method", value: "provider", description: "A provider round trip (Google, Microsoft, Zoho)." }
  - { enum: "identity.sign_in_method", value: "passkey", description: "A passkey." }
  - { enum: "identity.linked_via", value: "sign_up", description: "Signing up: the account's first way in." }
  - { enum: "identity.linked_via", value: "link", description: "Added while signed in (Ways to sign in)." }
  - { enum: "identity.linked_via", value: "connect", description: "Connecting a mailbox while signed in." }
  - { enum: "identity.passkey_added_via", value: "sign_up", description: "Signing up with a passkey alone." }
  - { enum: "identity.passkey_added_via", value: "passkey", description: "Added while signed in." }
  - { enum: "identity.client_kind", value: "first_party", description: "Campbooks' own (web, desktop and mobile)." }
  - { enum: "identity.client_kind", value: "workspace", description: "A workspace's own app." }
  - { enum: "identity.client_kind", value: "dynamic", description: "Registered itself (RFC 7591)." }
  - { enum: "identity.client_kind", value: "metadata_document", description: "Known by its Client ID Metadata Document (its id is a URL, never kept)." }
  - { enum: "identity.sign_in_failure", value: "invalid_state", description: "The round trip came back unknown, expired, or to another browser." }
  - { enum: "identity.sign_in_failure", value: "cancelled_at_provider", description: "The person cancelled at the provider." }
  - { enum: "identity.sign_in_failure", value: "provider_unavailable", description: "The provider could not be reached or answered with an error." }
  - { enum: "identity.sign_in_failure", value: "login_failed", description: "The provider refused to finish (its code or ID token did not verify)." }
  - { enum: "identity.sign_in_failure", value: "account_suspended", description: "An administrator suspended the account." }
  - { enum: "identity.sign_in_failure", value: "signup_invite_only", description: "No account yet, and the instance takes invited people only." }
  - { enum: "identity.sign_in_failure", value: "sign_in_not_allowed", description: "The instance's allow-list does not let the address in." }
  - { enum: "identity.sign_in_failure", value: "passkey_not_accepted", description: "The passkey did not verify, or is no way into any account." }
  - { enum: "identity.sign_in_failure", value: "passkey_expired", description: "No passkey ceremony waits for this browser (too slow, or used)." }
  - { enum: "identity.way_in_removal", value: "member", description: "The person removed it (Ways to sign in)." }
  - { enum: "identity.way_in_removal", value: "connect_failed", description: "The mailbox hand-over of the round trip that added it failed, so it was taken back." }
  - { enum: "identity.way_in_removal", value: "mailbox_never_connected", description: "It came from connecting a mailbox that never got a connection." }
  - { enum: "identity.client_removal", value: "removed", description: "A workspace admin removed it." }
  - { enum: "identity.client_removal", value: "member_left", description: "The member who registered it left the workspace." }

actors:
  - type: "client"
    id_is: "the OAuth client id when Campbooks minted it (campbooks-web, campbooks-native, cb_…, dcr_…); none for any other client (one known by its metadata document has a URL for an id)"
    description: "An app acting on its own behalf (client credentials)."

coverage:
  - kind: "operation"
    name: "identity.finish_sign_in"
    events: [identity.sign_in_succeeded, identity.sign_in_failed, identity.way_in_added, identity.way_in_removed]
  - kind: "operation"
    name: "identity.create_account"
    events: [identity.account_created, identity.sign_in_succeeded, identity.sign_in_failed]
  - kind: "operation"
    name: "identity.finish_passkey_sign_in"
    events: [identity.sign_in_succeeded, identity.sign_in_failed, identity.passkey_counter_regressed]
  - kind: "operation"
    name: "identity.finish_passkey_sign_up"
    events: [identity.account_created, identity.sign_in_succeeded]
  - kind: "operation"
    name: "identity.end_session"
    events: [identity.session_ended]
  - kind: "operation"
    name: "identity.end_session_post"
    events: [identity.session_ended]
  - kind: "operation"
    name: "identity.sign_out_everywhere"
    events: [identity.sessions_ended]
  - kind: "operation"
    name: "identity.remove_way_in"
    events: [identity.way_in_removed]
  - kind: "operation"
    name: "identity.register_passkey"
    events: [identity.passkey_registered]
  - kind: "operation"
    name: "identity.rename_passkey"
    events: [identity.passkey_renamed]
  - kind: "operation"
    name: "identity.remove_passkey"
    events: [identity.passkey_removed]
  - kind: "operation"
    name: "identity.admin_suspend_account"
    events: [identity.account_suspended]
  - kind: "operation"
    name: "identity.admin_unsuspend_account"
    events: [identity.account_unsuspended]
  - kind: "operation"
    name: "identity.register_client"
    events: [identity.client_registered]
  - kind: "operation"
    name: "identity.rotate_client_secret"
    events: [identity.client_secret_rotated]
  - kind: "operation"
    name: "identity.remove_client"
    events: [identity.client_removed]
  - kind: "operation"
    name: "identity.register"
    events: [identity.dynamic_client_registered]
  - kind: "operation"
    name: "identity.answer_consent"
    events: [identity.consent_granted, identity.consent_denied]
  - kind: "operation"
    name: "identity.revoke_consent"
    events: [identity.consent_revoked]
  - kind: "operation"
    name: "identity.discard_held_grant"
    events: [identity.held_grant_discarded]
  - kind: "operation"
    name: "identity.adopt_held_grant"
    events: [identity.held_grant_adopted]
  - kind: "operation"
    name: "identity.token"
    events: [identity.tokens_issued, identity.refresh_reuse_detected]
  - kind: "operation"
    name: "identity.revoke"
    events: [identity.refresh_token_revoked]
  - kind: "operation"
    name: "identity.start_sign_in"
    exemption: "only starts a provider round trip; identity.finish_sign_in tracks its outcome"
  - kind: "operation"
    name: "identity.start_link"
    exemption: "only issues a ticket for a signed-in round trip; identity.finish_sign_in tracks its outcome"
  - kind: "operation"
    name: "identity.start_passkey_registration"
    exemption: "only starts a passkey ceremony; identity.register_passkey tracks its outcome"
  - kind: "operation"
    name: "identity.start_passkey_sign_in"
    exemption: "only starts a passkey ceremony; identity.finish_passkey_sign_in tracks its outcome"
  - kind: "operation"
    name: "identity.start_passkey_sign_up"
    exemption: "only starts a passkey ceremony; identity.finish_passkey_sign_up tracks its outcome"
  - kind: "operation"
    name: "identity.authorize"
    exemption: "issues a short-lived code for a session that exists, or sends the browser to sign in; the code's redemption is tracked by identity.token"
  - kind: "handler"
    name: "identity.forget_connected_way_in"
    events: [identity.connected_way_in_removed]
  - kind: "handler"
    name: "identity.revoke_departed_consents"
    events: [identity.consents_revoked, identity.client_removed]
  - kind: "handler"
    name: "identity.name_connected_mailbox"
    exemption: "bookkeeping: a way in's mailbox record named with the connection the connectors module confirms (tracked there); no action of anyone changes"
  - kind: "handler"
    name: "identity.notify_way_in_added"
    exemption: "sends the notice of identity.way_in_added, which is tracked where the way in is added"
  - kind: "handler"
    name: "identity.remove_workspace_clients"
    exemption: "consequence of workspaces.workspace_deleting (tracked by workspaces): the deleted workspace's apps and their access go with it"
  - kind: "schedule"
    name: "identity.prune"
    events: [identity.way_in_removed]
