  - record: "identity.consent"
    field: "account_id"
    type: "id"
    required: true
    classification: "pseudonymous"
    description: "The account that gave it."
  - record: "identity.consent"
    field: "client_id"
    type: "code"
    required: false
    classification: "id"
    pattern: "^(campbooks-web|campbooks-native|cb_[A-Za-z0-9_-]{22}|dcr_[A-Za-z0-9_-]{22})$"
    description: "The client it lets in, when Campbooks minted its id; absent for a metadata-document client."
  - record: "identity.consent"
    field: "client_kind"
    type: "enum"
