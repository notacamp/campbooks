    required: true
    classification: "id"
    description: "The passkey's id (never its credential id)."
  - record: "identity.passkey"
    field: "account_id"
    type: "id"
    required: true
    classification: "pseudonymous"
    description: "The account it is a way into."
  - record: "identity.passkey"
