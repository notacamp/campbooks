  - record: "identity.account"
    field: "provider_ways_in"
    type: "int"
    required: true
    classification: "operational"
    description: "How many provider identities are ways into it."
  - record: "identity.account"
    field: "passkeys"
    type: "int"
    required: true
    classification: "operational"
    description: "How many passkeys are ways into it."
  - record: "identity.account"
