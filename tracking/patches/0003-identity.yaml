  - record: "identity.passkey"
    field: "backup_state"
    type: "bool"
    required: true
    classification: "operational"
    description: "Whether it is synced now."
  - record: "identity.passkey"
    field: "created_at"
    type: "timestamp"
    required: true
    classification: "operational"
    description: "When it was added."
  - record: "identity.passkey"
    field: "last_used_at"
    type: "timestamp"
    required: false
    classification: "operational"
    description: "When it was last used to sign in."
  - record: "identity.client"
