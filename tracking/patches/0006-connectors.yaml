# The connectors module's tracked events (campbooks-cloud#329, OpenSpec change
# track-connectors-events): connections added, reconnected, removed, their
# health and sync requests; one summary per sync run and per run's outbound
# changes; calendar changes and sends as they end. Every mutating operation,
# job, schedule and event handler of the module gets a Coverage row. Applied
# with `cargo run -p campbooks-tracking-plan -- apply tracking/patches/0006-connectors.yaml`.
changelog:
  - date: "2026-10-25"
    plan_version: 6
    change: "The connectors module instrumented (campbooks-cloud#329): 10 events for connections added, reconnected, removed, their health changed and a sync asked for, sync runs (one summary per run, with counts), the outbound changes a run made (counts by end), calendar changes completed, and sends succeeded or failed; records connection, stream and send; Coverage for every operation, job, schedule and handler of the module; the identity operations that hand it a grant name the connection events."
    pr: "#659"

events:
  - name: "connectors.connection_added"
    version: 1
    module: "connectors"
    object: "connection"
    action: "added"
    scope: "workspace"
    status: "live"
    actor_types: [user, anonymous]
    description: "A member connected an outside account: a new connection, with its streams. Never its address or display name."
    fires_when: "connectors.connect_imap, or the grant-intake port (identity.finish_sign_in connecting through the front door, identity.adopt_held_grant), stores a grant for an account the workspace had no connection of, in the transaction that stores its credentials."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.connection_reconnected"
    version: 1
    module: "connectors"
    object: "connection"
    action: "reconnected"
    scope: "workspace"
    status: "live"
    actor_types: [user, anonymous]
    description: "A member gave a grant again for the account of their existing connection (a reconnect, a consent extending it, an IMAP password given again): its health is ok and its paused streams resume."
    fires_when: "The same seam as connectors.connection_added finds the member's connection of that account and refreshes it, in the transaction that stores its credentials."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.connection_removed"
    version: 1
    module: "connectors"
    object: "connection"
    action: "removed"
    scope: "workspace"
    status: "live"
    actor_types: [user, system]
    description: "A connection was deleted with its credentials and streams; the cause says why and mail what becomes of the mail it brought in. The snapshot is the connection as it stood."
    fires_when: "connectors.disconnect (disconnected), or connectors.revoke_departed_grants on workspaces.member_left (member_left), deletes it, in that transaction; one gone already tracks nothing. A deleted workspace's connections are not tracked (workspaces.workspace_deleted is)."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.connection_health_changed"
    version: 1
    module: "connectors"
    object: "connection"
    action: "health_changed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A connection's health or its reason changed: it needs the member again (needs_reauth), the provider slowed it down (throttled), its runs keep failing (failing), or a good run made it ok again. Reconnecting is connectors.connection_reconnected."
    fires_when: "A run of connectors.sync_stream, connectors.send_message or an IMAP IDLE session sets another health or reason, in the transaction that sets it; the same health and reason again tracks nothing."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.connection_sync_requested"
    version: 1
    module: "connectors"
    object: "connection"
    action: "sync_requested"
    scope: "workspace"
    status: "live"
    actor_types: [user, client, assistant, automation]
    description: "Someone asked for a connection's streams to run now."
    fires_when: "connectors.sync_now schedules at least one of its streams to run now, in that transaction; a connection with no stream to run tracks nothing."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.stream_synced"
    version: 1
    module: "connectors"
    object: "stream"
    action: "synced"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "One run of a stream (mail or calendar) read the provider and stored what changed: one summary per run, with counts, never the messages or events."
    fires_when: "A run of connectors.sync_stream stores at least one batch of changes or moves the stream's phase (the first sync done, a resync begun), in the job's transaction that advances its cursor; a run that found nothing tracks nothing."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.outbound_changes_made"
    version: 1
    module: "connectors"
    object: "outbound_changes"
    action: "made"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A run made members' changes to their conversations (read, starred, archived, labelled, moved) at the provider: one summary per run, with counts by how they ended."
    fires_when: "A run of connectors.sync_stream records the end of at least one outbound change (applied, superseded, skipped or failed), in the transaction that records it; changes left pending for a later run are not counted."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.calendar_change_completed"
    version: 1
    module: "connectors"
    object: "calendar_change"
    action: "completed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A member's change to a provider calendar's event ended: written at the provider, superseded by a change made there, skipped, or failed. The ids are the schedule module's."
    fires_when: "A calendar run of connectors.sync_stream ends it, or connectors.record_calendar_change ends it at once (it does not stand, the connection is gone or waits for the member), in the transaction that publishes connectors.calendar_change_completed."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.send_succeeded"
    version: 1
    module: "connectors"
    object: "send"
    action: "succeeded"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "The provider has a message a member sent: sent now, or an earlier attempt found by its lookup."
    fires_when: "connectors.send_message marks the send sent, in the transaction that announces it; a send settled already tracks nothing."
    added_in: 6
    openspec_change: "track-connectors-events"
  - name: "connectors.send_failed"
    version: 1
    module: "connectors"
    object: "send"
    action: "failed"
    scope: "workspace"
    status: "live"
    actor_types: [system]
    description: "A send failed for good; error is the kind of failure, never the provider's words."
    fires_when: "connectors.send_message marks the send failed (refused, too large, not connected, the grant gone, no longer standing, out of attempts), in the transaction that announces it; a send settled already tracks nothing."
    added_in: 6
    openspec_change: "track-connectors-events"

properties:
  - { event: "connectors.connection_added", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The new connection." }
  - { event: "connectors.connection_reconnected", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The connection afterwards." }
  - { event: "connectors.connection_reconnected", version: 1, property: "before_health", type: "enum", of: "connectors.health", required: true, classification: "operational", description: "Its health before." }
  - { event: "connectors.connection_reconnected", version: 1, property: "capabilities_added", type: "enum", list: true, of: "connectors.capability", required: true, classification: "operational", description: "The capabilities it did not have before; usually none." }
  - { event: "connectors.connection_reconnected", version: 1, property: "mailboxes_added", type: "int", required: true, classification: "operational", description: "Mailboxes the grant reaches that it did not read before; usually none." }
  - { event: "connectors.connection_removed", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The connection as it stood when it was removed." }
  - { event: "connectors.connection_removed", version: 1, property: "cause", type: "enum", of: "connectors.removal_cause", required: true, classification: "operational", description: "Why it was removed." }
  - { event: "connectors.connection_removed", version: 1, property: "mail", type: "enum", of: "connectors.mail_choice", required: true, classification: "operational", description: "What becomes of the mail it brought in." }
  - { event: "connectors.connection_health_changed", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The connection with its new health and reason." }
  - { event: "connectors.connection_health_changed", version: 1, property: "before", type: "enum", of: "connectors.health", required: true, classification: "operational", description: "Its health before (the same when only the reason changed)." }
  - { event: "connectors.connection_sync_requested", version: 1, property: "connection", type: "record", of: "connectors.connection", required: true, classification: "operational", description: "The connection." }
  - { event: "connectors.connection_sync_requested", version: 1, property: "streams", type: "int", required: true, classification: "operational", description: "How many of its streams were set to run now (at least 1)." }
  - { event: "connectors.stream_synced", version: 1, property: "stream", type: "record", of: "connectors.stream", required: true, classification: "operational", description: "The stream after the run." }
  - { event: "connectors.stream_synced", version: 1, property: "provider", type: "enum", of: "connectors.provider", required: true, classification: "operational", description: "Its connection's provider." }
  - { event: "connectors.stream_synced", version: 1, property: "before_phase", type: "enum", of: "connectors.phase", required: true, classification: "operational", description: "Its phase before the run." }
  - { event: "connectors.stream_synced", version: 1, property: "changes", type: "int", required: true, classification: "operational", description: "Changes the run stored: messages added, changed or removed (mail), events changed or removed (calendar)." }
  - { event: "connectors.stream_synced", version: 1, property: "batches", type: "int", required: true, classification: "operational", description: "Batches the run stored and announced." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "stream_id", type: "id", required: true, classification: "id", description: "The stream whose run made them." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "connection_id", type: "id", required: true, classification: "id", description: "Its connection." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "provider", type: "enum", of: "connectors.provider", required: true, classification: "operational", description: "The provider they were made at." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "applied", type: "int", required: true, classification: "operational", description: "Changes made at the provider." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "superseded", type: "int", required: true, classification: "operational", description: "Changes overtaken by a later one, of a member or at the provider." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "skipped", type: "int", required: true, classification: "operational", description: "Changes with nothing to do at the provider." }
  - { event: "connectors.outbound_changes_made", version: 1, property: "failed", type: "int", required: true, classification: "operational", description: "Changes the provider refused, or that met trouble too often." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "request_id", type: "id", required: true, classification: "id", description: "The schedule module's request." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "calendar_id", type: "id", required: true, classification: "id", description: "The schedule module's calendar." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "event_id", type: "id", required: true, classification: "id", description: "The schedule module's event." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "stream_id", type: "id", required: false, classification: "id", description: "The calendar stream that made or ended it, when it was recorded for one." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "change", type: "enum", of: "connectors.calendar_change", required: false, classification: "operational", description: "The kind of change, when it is one the plan names." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "outcome", type: "enum", of: "connectors.calendar_outcome", required: true, classification: "operational", description: "How it ended." }
  - { event: "connectors.calendar_change_completed", version: 1, property: "reason", type: "enum", of: "connectors.calendar_reason", required: false, classification: "operational", description: "Why, when it was not applied." }
  - { event: "connectors.send_succeeded", version: 1, property: "send", type: "record", of: "connectors.send", required: true, classification: "operational", description: "The send, sent." }
  - { event: "connectors.send_failed", version: 1, property: "send", type: "record", of: "connectors.send", required: true, classification: "operational", description: "The send, failed." }
  - { event: "connectors.send_failed", version: 1, property: "error", type: "enum", of: "connectors.send_error", required: true, classification: "operational", description: "The kind of failure." }

records:
  - { record: "connectors.connection", field: "id", type: "id", required: true, classification: "id", description: "The connection's id." }
  - { record: "connectors.connection", field: "provider", type: "enum", enum: "connectors.provider", required: true, classification: "operational", description: "The provider." }
  - { record: "connectors.connection", field: "granted_by", type: "id", required: true, classification: "pseudonymous", description: "The member who granted it: their user id." }
  - { record: "connectors.connection", field: "capabilities", type: "enum", list: true, enum: "connectors.capability", required: true, classification: "operational", description: "What it lets Campbooks do." }
  - { record: "connectors.connection", field: "health", type: "enum", enum: "connectors.health", required: true, classification: "operational", description: "How it is doing." }
  - { record: "connectors.connection", field: "health_reason", type: "enum", enum: "connectors.health_reason", required: false, classification: "operational", description: "Why, when it is not ok." }
  - { record: "connectors.connection", field: "address_verified", type: "bool", required: true, classification: "operational", description: "Whether the provider verified the account's address (never the address)." }
  - { record: "connectors.connection", field: "mailboxes", type: "int", required: true, classification: "operational", description: "Mailboxes it reads: its messages streams." }
  - { record: "connectors.connection", field: "created_at", type: "timestamp", required: true, classification: "operational", description: "When it was connected." }
  - { record: "connectors.connection", field: "health_changed_at", type: "timestamp", required: true, classification: "operational", description: "Since when it has had this health." }
  - { record: "connectors.stream", field: "id", type: "id", required: true, classification: "id", description: "The stream's id." }
  - { record: "connectors.stream", field: "connection_id", type: "id", required: true, classification: "id", description: "Its connection." }
  - { record: "connectors.stream", field: "capability", type: "enum", enum: "connectors.capability", required: true, classification: "operational", description: "What it reads." }
  - { record: "connectors.stream", field: "inbox_id", type: "id", required: false, classification: "id", description: "The conversations inbox it feeds (messages)." }
  - { record: "connectors.stream", field: "phase", type: "enum", enum: "connectors.phase", required: true, classification: "operational", description: "Where it is in its reading." }
  - { record: "connectors.stream", field: "paused", type: "bool", required: true, classification: "operational", description: "Paused until the member connects again." }
  - { record: "connectors.stream", field: "last_synced_at", type: "timestamp", required: false, classification: "operational", description: "When a run last finished." }
  - { record: "connectors.stream", field: "last_change_at", type: "timestamp", required: false, classification: "operational", description: "When a run last found a change." }
  - { record: "connectors.send", field: "id", type: "id", required: true, classification: "id", description: "The send's id (minted by conversations)." }
  - { record: "connectors.send", field: "inbox_id", type: "id", required: true, classification: "id", description: "The inbox it is sent from." }
  - { record: "connectors.send", field: "stream_id", type: "id", required: false, classification: "id", description: "The stream it goes through, while the inbox has one." }
  - { record: "connectors.send", field: "provider", type: "enum", enum: "connectors.provider", required: false, classification: "operational", description: "The provider it goes through, while the inbox has a connection." }
  - { record: "connectors.send", field: "state", type: "enum", enum: "connectors.send_state", required: true, classification: "operational", description: "Where it stands." }
  - { record: "connectors.send", field: "attempts", type: "int", required: true, classification: "operational", description: "Calls made to the provider." }
  - { record: "connectors.send", field: "sent_copy", type: "enum", enum: "connectors.sent_copy", required: false, classification: "operational", description: "What becomes of its copy in Sent (IMAP only)." }
  - { record: "connectors.send", field: "created_at", type: "timestamp", required: true, classification: "operational", description: "When it was asked for." }

enums:
  - { enum: "connectors.provider", value: "google", description: "Google: Gmail and Google Calendar." }
  - { enum: "connectors.provider", value: "zoho", description: "Zoho: Zoho Mail and Zoho Calendar." }
  - { enum: "connectors.provider", value: "imap", description: "Any mailbox over IMAP and SMTP, with its password." }
  - { enum: "connectors.capability", value: "messages", description: "Read and tidy mail." }
  - { enum: "connectors.capability", value: "calendar", description: "Calendars and events." }
  - { enum: "connectors.capability", value: "files", description: "Files (not offered yet)." }
  - { enum: "connectors.capability", value: "bank", description: "Bank data (not offered yet)." }
  - { enum: "connectors.health", value: "ok", description: "Syncing normally." }
  - { enum: "connectors.health", value: "needs_reauth", description: "The grant stopped working: the member must connect again; its streams are paused." }
  - { enum: "connectors.health", value: "throttled", description: "The provider asked to slow down; syncing resumes on its own." }
