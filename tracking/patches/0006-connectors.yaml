  - { enum: "connectors.health_reason", value: "imap_login_refused", description: "The IMAP server refused the password too many times in a row." }
  - { enum: "connectors.health_reason", value: "rate_limited", description: "The provider rate limited the runs." }
  - { enum: "connectors.health_reason", value: "provider_errors", description: "The provider failed run after run." }
  - { enum: "connectors.health_reason", value: "other", description: "A reason this plan does not know yet." }
  - { enum: "connectors.phase", value: "backfill", description: "Reading the initial window." }
  - { enum: "connectors.phase", value: "incremental", description: "Following changes from the cursor." }
  - { enum: "connectors.phase", value: "resync", description: "Re-reading the window after the provider forgot the cursor." }
  - { enum: "connectors.removal_cause", value: "disconnected", description: "The member who connected it disconnected it (connectors.disconnect)." }
  - { enum: "connectors.removal_cause", value: "member_left", description: "The member who connected it left the workspace or was removed (workspaces.member_left)." }
  - { enum: "connectors.mail_choice", value: "delete", description: "The inboxes it fed are deleted." }
  - { enum: "connectors.mail_choice", value: "keep", description: "The inboxes it fed are kept, read-only." }
  - { enum: "connectors.send_state", value: "pending", description: "Not settled yet." }
  - { enum: "connectors.send_state", value: "sent", description: "The provider has it." }
  - { enum: "connectors.send_state", value: "failed", description: "It failed for good." }
  - { enum: "connectors.sent_copy", value: "pending", description: "The stream's next run appends it to Sent." }
  - { enum: "connectors.sent_copy", value: "appended", description: "Appended to Sent." }
  - { enum: "connectors.sent_copy", value: "found", description: "Already in Sent." }
  - { enum: "connectors.sent_copy", value: "provider", description: "The SMTP server keeps one itself." }
  - { enum: "connectors.sent_copy", value: "skipped", description: "No copy is made." }
  - { enum: "connectors.sent_copy", value: "failed", description: "Appending it kept failing." }
  - { enum: "connectors.send_error", value: "unavailable", description: "The provider could not be reached, or the send no longer stands; nothing was sent." }
  - { enum: "connectors.send_error", value: "not_connected", description: "The inbox's connection is gone, or its provider is not configured." }
  - { enum: "connectors.send_error", value: "needs_reauth", description: "The connection needs the member again." }
  - { enum: "connectors.send_error", value: "too_large", description: "Too large for the provider." }
  - { enum: "connectors.send_error", value: "rejected", description: "The provider refused it." }
  - { enum: "connectors.send_error", value: "unknown_outcome", description: "It may have been sent: an attempt ended with no clear answer." }
  - { enum: "connectors.send_error", value: "other", description: "A reason this plan does not know yet." }
  - { enum: "connectors.calendar_change", value: "create", description: "Create an event." }
  - { enum: "connectors.calendar_change", value: "update", description: "Change an event." }
  - { enum: "connectors.calendar_change", value: "update_occurrence", description: "Change one occurrence of a repeating event." }
  - { enum: "connectors.calendar_change", value: "delete", description: "Delete an event." }
  - { enum: "connectors.calendar_change", value: "respond", description: "Answer an invitation." }
  - { enum: "connectors.calendar_outcome", value: "applied", description: "Written at the provider." }
  - { enum: "connectors.calendar_outcome", value: "superseded", description: "The event had changed at the provider first." }
  - { enum: "connectors.calendar_outcome", value: "skipped", description: "Nothing was written." }
  - { enum: "connectors.calendar_outcome", value: "failed", description: "It failed." }
  - { enum: "connectors.calendar_reason", value: "changed_at_provider", description: "The event changed at the provider." }
  - { enum: "connectors.calendar_reason", value: "unverified", description: "The schedule module's records did not confirm the request." }
  - { enum: "connectors.calendar_reason", value: "not_connected", description: "The connection is gone, or its calendar is not offered." }
  - { enum: "connectors.calendar_reason", value: "needs_reauth", description: "The grant needs the member again." }
  - { enum: "connectors.calendar_reason", value: "rejected", description: "The provider refused it, or its document was not sound." }
  - { enum: "connectors.calendar_reason", value: "not_found", description: "The event is not at the provider." }
  - { enum: "connectors.calendar_reason", value: "unavailable", description: "The provider could not be reached in time." }
  - { enum: "connectors.calendar_reason", value: "api_not_enabled", description: "The calendar API is not enabled for this instance's app." }
  - { enum: "connectors.calendar_reason", value: "too_many_attempts", description: "It was tried the most times allowed." }

coverage:
  - kind: "operation"
    name: "connectors.connect_imap"
    events: [connectors.connection_added, connectors.connection_reconnected]
  - kind: "operation"
    name: "connectors.disconnect"
    events: [connectors.connection_removed]
  - kind: "operation"
    name: "connectors.sync_now"
    events: [connectors.connection_sync_requested]
  - kind: "operation"
    name: "connectors.start_connection"
    exemption: "only starts a consent through the identity module's front door; nothing of connectors changes, and the connection it becomes is tracked as connectors.connection_added or connectors.connection_reconnected"
  - kind: "job"
    name: "connectors.sync_stream"
    events: [connectors.stream_synced, connectors.outbound_changes_made, connectors.calendar_change_completed, connectors.connection_health_changed]
  - kind: "job"
    name: "connectors.send_message"
    events: [connectors.send_succeeded, connectors.send_failed, connectors.connection_health_changed]
  - kind: "job"
    name: "connectors.retag_bindings"
    exemption: "maintenance, no action of anyone: MACs of pending changes re-tagged after a key rotation"
  - kind: "schedule"
    name: "connectors.dispatch_due"
    exemption: "maintenance, no action of anyone: only enqueues the runs that are due, which track"
  - kind: "handler"
    name: "connectors.revoke_departed_grants"
    events: [connectors.connection_removed]
  - kind: "handler"
    name: "connectors.record_calendar_change"
    events: [connectors.calendar_change_completed]
  - kind: "handler"
    name: "connectors.queue_send"
    exemption: "records the send conversations asked for (tracked there); its outcome is connectors.send_succeeded or connectors.send_failed"
  - kind: "handler"
    name: "connectors.request_changes"
    exemption: "records the changes conversations asked for (tracked there as the conversation's changes) for the stream's next run, which tracks connectors.outbound_changes_made"
  - kind: "handler"
    name: "connectors.apply_calendar_sync"
    exemption: "projection of the schedule module's calendar switched on or off (tracked there): which calendars the stream reads"
  - kind: "handler"
    name: "connectors.revoke_workspace_grants"
    exemption: "consequence of workspaces.workspace_deleted (tracked by workspaces): the deleted workspace's connections go with it"
  # Identity's operations hand grants to connectors through the grant-intake
  # port: the connection they become is tracked here.
  - kind: "operation"
    name: "identity.finish_sign_in"
    events: [identity.sign_in_succeeded, identity.sign_in_failed, identity.way_in_added, identity.way_in_removed, connectors.connection_added, connectors.connection_reconnected]
  - kind: "operation"
    name: "identity.adopt_held_grant"
    events: [identity.held_grant_adopted, connectors.connection_added, connectors.connection_reconnected]
