[workspace]
resolver = "3"
# `crates/*` would also match the `crates/modules` directory (which has no
# manifest), so the platform crates are listed explicitly; modules use a glob.
members = ["crates/kernel", "crates/ai", "crates/server", "crates/modules/*", "xtask"]
exclude = ["clients"]

[workspace.package]
# Must equal the `VERSION` file at the repo root (checked by `cargo xtask arch`).
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "LicenseRef-Sustainable-Use"
repository = "https://github.com/notacamp/campbooks"
publish = false

[workspace.dependencies]
# Internal crates
campbooks-kernel = { path = "crates/kernel" }
campbooks-ai = { path = "crates/ai" }
campbooks-server = { path = "crates/server" }
campbooks-system = { path = "crates/modules/system" }
campbooks-workspaces = { path = "crates/modules/workspaces" }
campbooks-conversations = { path = "crates/modules/conversations" }
campbooks-connectors = { path = "crates/modules/connectors" }
campbooks-identity = { path = "crates/modules/identity" }
campbooks-admin = { path = "crates/modules/admin" }
campbooks-attention = { path = "crates/modules/attention" }
campbooks-search = { path = "crates/modules/search" }

# HTTP / async
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "form", "tokio", "tower-log", "tracing", "matched-path"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["request-id", "timeout", "compression-gzip", "compression-br", "util", "fs", "set-header"] }
http-body-util = "0.1.5"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json", "charset"] }
url = { version = "2.5.8", features = ["serde"] }
# CIDR blocks of trusted reverse proxies (rate limits); already in the graph
# through reqwest.
ipnet = "2.12.2"

# OpenAPI
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid", "chrono", "url"] }
utoipa-axum = "0.3.0"

# Database
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }

# Object storage for blobs (ADR 0011): local disk, S3-compatible stores and an
# in-memory store for tests behind one interface, with streaming multipart
# upload. Its `aws` feature signs with aws-lc-rs and talks through reqwest 0.13,
# both already in the graph.
object_store = { version = "0.14.2", default-features = false, features = ["fs", "aws"] }
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }

# Serialization / config
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
figment = { version = "0.10.19", features = ["env"] }
toml = "1.1.8"

# Internationalization: CLDR plural rules for the server's message catalogues
# (the same rules as the browser's `Intl.PluralRules`). ICU4X; its locale and
# provider core crates are already in the graph through `url` -> `idna`.
icu_plurals = "2.3.0"
icu_locale_core = "2.3.0"
# Compatibility decomposition (NFKD) for look-alike app names (identity);
# already in the graph through url -> idna.
icu_normalizer = "2.3.0"
# Unicode general categories (marks of every script) for look-alike app
# names (identity); already in the graph through url -> idna.
icu_properties = "2.3.0"
# UTS #39 confusables skeletons and mixed-script detection for look-alike app
# names (identity).
unicode-security = "0.1.2"

# Errors, observability, misc
# The Public Suffix List, compiled in (no runtime fetch): the registrable
# domain of a sender (`decide::signals::facts`).
psl = "2.1.241"
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }
# Telemetry (traces + metrics, see openspec/changes/observability): the
# OpenTelemetry API for instruments and context propagation, bridged from
# `tracing` spans. Exporters are off unless configured (`CAMPBOOKS_TELEMETRY__*`).
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33.0", default-features = false, features = ["trace", "metrics", "internal-logs"] }
# OTLP over HTTP/protobuf on the SDK's own export threads (blocking reqwest
# 0.13, the version already in the graph); no gRPC/tonic.
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "metrics", "internal-logs"] }
# The Prometheus text format for the optional scrape endpoint.
opentelemetry-prometheus = "0.33.0"
prometheus = { version = "0.14.0", default-features = false }
tracing-opentelemetry = { version = "0.34.0", default-features = false }
# sqlx's pool options take a `log` level; already in the graph via sqlx.
log = "0.4.34"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
secrecy = { version = "0.10.3", features = ["serde"] }
# The instance's own mail (security notices): SMTP over rustls (aws-lc-rs,
# platform roots: both already in the graph), no native-tls, no logging.
lettre = { version = "0.11.23", default-features = false, features = ["smtp-transport", "hostname", "builder", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }
# JWT access-token validation. aws-lc-rs is the crypto backend rustls already
# uses; no PEM support needed (keys come from the IdP's JWKS).
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs"] }
clap = { version = "4.6.7", features = ["derive", "env"] }

# Tooling (xtask)
cargo_metadata = "0.23.1"
regex = "1.13.1"

# Email: sanitising untrusted HTML bodies before they reach the client's
# sandboxed frame (conversations). html5ever-based allow-list cleaner.
# Pinned: 4.2.3 is newer than the two-week rule because it fixes
# RUSTSEC-2021-0157/0158 in 4.2.0. Relax to a caret requirement after
# 2026-10-27.
ammonia = "=4.2.3"

# Search: telling which of the four shipped languages an entry is written in
# (whatlang: trigram profiles, no model files, MIT).
whatlang = "0.18.0"
# Email: MIME building of messages to send and parsing of raw messages
# (connectors' email adapters).
mail-builder = { version = "1.0.0", default-features = false }
mail-parser = { version = "0.11.9", default-features = false }

# Passkeys (identity, ADR 0014): COSE_Key parsing and the CBOR of WebAuthn
# attestation objects. Signatures are verified with aws-lc-rs.
coset = "0.4.2"
ciborium = "0.2.2"

# Tests
wiremock = "0.6.5"
# JSON Schema (2020-12) validation in contract tests (`contracts/`).
boon = "0.6.1"
# Ed25519 keys for the test identity provider (`campbooks_kernel::testing::TestIdp`);
# already in the graph as the rustls / jsonwebtoken crypto backend.
aws-lc-rs = "1.18.1"
# Hand-crafting forged JWTs in auth tests; already in the graph via jsonwebtoken.
base64 = "0.22.1"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
# Allowed pedantic lints:
# - `module_name_repetitions`: vertical slices name types after their feature
#   (`health::HealthResponse`); the repetition is what makes them greppable.
module_name_repetitions = "allow"
# - `missing_errors_doc`: every fallible fn returns `kernel::Error` or a crate
#   `Error` enum whose variants are themselves documented.
missing_errors_doc = "allow"
# - `must_use_candidate`: fires on nearly every constructor/getter; `#[must_use]`
#   is added where ignoring the value is a real bug, not as decoration.
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
