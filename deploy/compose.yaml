# Campbooks for self-hosters.
#
#   cp .env.example .env        # then edit it
#   docker compose up -d        # server, postgres, identity provider
#   docker compose --profile ai up -d     # + local open-weight models (Laya, Ollama, TEI)
#
# See README.md in this directory.
name: campbooks

services:
  server:
    image: ghcr.io/notacamp/campbooks:next
    restart: unless-stopped
    # Behind a reverse proxy, set CAMPBOOKS_TRUSTED_PROXIES in .env to the
    # proxy's address or network (comma-separated addresses or CIDR blocks,
    # e.g. the Docker network the proxy reaches this container over). Without
    # it every request seems to come from the proxy, and the sign-in rate
    # limits count all clients as one.
    env_file: .env
    environment:
      # Two logins (ADR 0011). The server queries as `campbooks_runtime`, a
      # plain login that cannot bypass row-level security; db-init creates it
      # and generates its password into the db-secrets volume. The owner login
      # (built from POSTGRES_PASSWORD) only applies migrations.
      CAMPBOOKS_DATABASE_URL: postgres://campbooks_runtime@postgres:5432/campbooks
      CAMPBOOKS_DATABASE_PASSWORD_FILE: /run/db/runtime-password
      CAMPBOOKS_DATABASE_MIGRATION_URL: postgres://campbooks:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/campbooks
      # Trust the bundled IdP's access tokens (ADR 0004). To use another IdP,
      # change these lines (and drop the idp services).
      CAMPBOOKS_AUTH__ISSUER: ${CAMPBOOKS_IDP_URL:-http://localhost:8081}/auth/v1/
      CAMPBOOKS_AUTH__JWKS_URL: http://idp:8080/auth/v1/oidc/certs
      # Web sign-in (the BFF): the server reaches the IdP inside the compose
      # network; browsers use CAMPBOOKS_IDP_URL. Both secrets are files in the
      # `server-secrets` volume, never environment variables.
      CAMPBOOKS_BFF__IDP_INTERNAL_URL: http://idp:8080/auth/v1/
      CAMPBOOKS_BFF__CLIENT_SECRET_FILE: /run/campbooks/campbooks-web.client-secret
      CAMPBOOKS_SECRET_KEY_FILE: /run/campbooks/secret-key
    volumes:
      # Message bodies, attachments and files (CAMPBOOKS_BLOBS__PATH). Back it
      # up with Postgres; unused when CAMPBOOKS_BLOBS__BACKEND=s3.
      - blobs-data:/data/blobs
      # The instance secret key and the web client's OIDC secret, read through
      # the supplementary group 10001 (the files are 0440, see server/init.sh).
      - server-secrets:/run/campbooks:ro
      # The runtime database login's password (see db-init).
      - db-secrets:/run/db:ro
    group_add: ["10001"]
    # Web app and API on one port (the image sets CAMPBOOKS_WEB_DIR).
    ports:
      - "${CAMPBOOKS_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      server-init:
        condition: service_completed_successfully
      db-init:
        condition: service_completed_successfully
    # The image's HEALTHCHECK runs `campbooks-server healthcheck`.

  # One-shot: generates the instance secret key (CAMPBOOKS_SECRET_KEY) on first
  # boot into the `server-secrets` volume. See server/init.sh.
  server-init:
    image: busybox:1.37.0-musl
    restart: "no"
    command: ["sh", "/server/init.sh"]
    volumes:
      - ./server:/server:ro
      - server-secrets:/secrets

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: campbooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: campbooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campbooks -d campbooks"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the server's database login (see postgres/init.sh).
  db-init:
    image: pgvector/pgvector:pg17
    restart: "no"
    entrypoint: ["sh", "/postgres/init.sh"]
    environment:
      PGHOST: postgres
      PGUSER: campbooks
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: campbooks
    volumes:
      - ./postgres:/postgres:ro
      - db-secrets:/run/db
    depends_on:
      postgres:
        condition: service_healthy

  # --- Identity provider (OIDC / OAuth 2.1) -------------------------------------
  # Rauthy (ADR 0004). Three services, no manual steps:
  #   idp-init       one-shot: generates secrets on first boot, writes config
  #   idp            the IdP itself; issuer = ${CAMPBOOKS_IDP_URL}/auth/v1/
  #   idp-provision  one-shot: registers Campbooks' scopes and clients, and the
  #                  sign-in providers (Google, Microsoft, Zoho) you configure
  # Admin UI: ${CAMPBOOKS_IDP_URL}/auth/v1/admin — see README.md for first login.
  idp-init:
    image: busybox:1.37.0-musl
    restart: "no"
    command: ["sh", "/idp/init.sh"]
    environment:
      CAMPBOOKS_IDP_URL: ${CAMPBOOKS_IDP_URL:-http://localhost:8081}
      CAMPBOOKS_IDP_ADMIN_EMAIL: ${CAMPBOOKS_IDP_ADMIN_EMAIL:-admin@localhost}
      CAMPBOOKS_IDP_TRUSTED_PROXIES: ${CAMPBOOKS_IDP_TRUSTED_PROXIES:-}
    volumes:
      - ./idp:/idp:ro
      - idp-data:/app/data

  idp:
    image: ghcr.io/sebadob/rauthy:0.36.2
    restart: unless-stopped
    # Rauthy needs a few seconds for a clean shutdown; a force-kill costs a WAL
    # integrity check on the next start.
    stop_grace_period: 30s
    command: ["serve", "--config-file", "/app/data/config.toml", "--secrets-file", "/app/data/secrets.toml"]
    # Rauthy reads its config from the volume (written by idp-init). Optional
    # outgoing mail (password resets, invitations): add SMTP_URL, SMTP_USERNAME,
    # SMTP_PASSWORD and SMTP_FROM under `environment:` here.
    volumes:
      - idp-data:/app/data
    ports:
      - "${CAMPBOOKS_IDP_PORT:-8081}:8080"
    depends_on:
      idp-init:
        condition: service_completed_successfully
    healthcheck:
      # The image is distroless; idp-init drops a static busybox into the volume.
      test: ["CMD", "/app/data/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/auth/v1/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  idp-provision:
    image: curlimages/curl:8.22.0
    restart: "no"
    user: "10001:10001"
    entrypoint: ["sh", "/idp/provision.sh"]
    environment:
      CAMPBOOKS_PUBLIC_URL: ${CAMPBOOKS_PUBLIC_URL:-http://localhost:8080}
      # Where Rauthy delivers back-channel logouts; empty means the public URL
      # (https only: Rauthy refuses plain http). See README.md.
      CAMPBOOKS_BACKCHANNEL_LOGOUT_URL: ${CAMPBOOKS_BACKCHANNEL_LOGOUT_URL:-}
      # Sign in with Google, Microsoft or Zoho: a provider is registered when
      # its client ID is set; its secret is the file secrets/<provider>-client-secret.
      # See README.md -> "Sign in with Google, Microsoft or Zoho".
      CAMPBOOKS_IDP_URL: ${CAMPBOOKS_IDP_URL:-http://localhost:8081}
      CAMPBOOKS_SIGNUP__POLICY: ${CAMPBOOKS_SIGNUP__POLICY:-open}
      CAMPBOOKS_IDP_PROVIDER_SIGNUP: ${CAMPBOOKS_IDP_PROVIDER_SIGNUP:-auto}
      CAMPBOOKS_IDP_GOOGLE_CLIENT_ID: ${CAMPBOOKS_IDP_GOOGLE_CLIENT_ID:-}
      CAMPBOOKS_IDP_GOOGLE_CLIENT_SECRET_FILE: /run/secrets/campbooks/google-client-secret
      CAMPBOOKS_IDP_MICROSOFT_CLIENT_ID: ${CAMPBOOKS_IDP_MICROSOFT_CLIENT_ID:-}
      CAMPBOOKS_IDP_MICROSOFT_CLIENT_SECRET_FILE: /run/secrets/campbooks/microsoft-client-secret
      CAMPBOOKS_IDP_MICROSOFT_TENANT: ${CAMPBOOKS_IDP_MICROSOFT_TENANT:-common}
      CAMPBOOKS_IDP_ZOHO_CLIENT_ID: ${CAMPBOOKS_IDP_ZOHO_CLIENT_ID:-}
      CAMPBOOKS_IDP_ZOHO_CLIENT_SECRET_FILE: /run/secrets/campbooks/zoho-client-secret
      CAMPBOOKS_IDP_ZOHO_ISSUER: ${CAMPBOOKS_IDP_ZOHO_ISSUER:-https://accounts.zoho.eu}
    volumes:
      - ./idp:/idp:ro
      - idp-data:/app/data
      # Writes the web client's secret here for the server.
      - server-secrets:/secrets
      # The sign-in providers' client secrets (files readable by uid 10001).
      - ./secrets:/run/secrets/campbooks:ro
    depends_on:
      idp:
        condition: service_healthy
      server-init:
        condition: service_completed_successfully

  # --- Local AI (open-weight models) --------------------------------------------
  # Optional: `docker compose --profile ai up -d`. See README.md → Local AI.
  #
  # laya: the `decide` role (typed decisions, ADR 0009). The image is built
  # from ./laya by the release pipeline (linux/amd64 + linux/arm64, scanned,
  # same tags as the server image); it downloads the multilingual checkpoint
  # (~680 MB) into the `laya-models` volume on first start. Runs well on CPU.
  # No published port: only the server reaches it, on the compose network.
  laya:
    profiles: ["ai"]
    image: ghcr.io/notacamp/campbooks-laya:next
    # To build it yourself instead (e.g. after editing ./laya), swap the line
    # above for this one and run `docker compose --profile ai build laya`:
    # build: ./laya
    restart: unless-stopped
    environment:
      # laya-serve answers anyone when its key is empty, so the container
      # refuses to start without one. Set it in .env; the server sends the
      # same value.
      LAYA_API_KEY: ${CAMPBOOKS_AI__DECIDE__API_KEY:-}
      # Cap the CPU threads inference uses (default: all cores).
      # LAYA_THREADS: "4"
    volumes:
      - laya-models:/models
    # The image's HEALTHCHECK probes /health; allow for the first download.

  # ollama: `complete` (and optionally `vision`). CPU inference works but is slow.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # GPU (NVIDIA): uncomment and install the NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  embeddings:
    profiles: ["ai"]
    # The CPU build of TEI is published for linux/amd64 only. On arm64 hosts,
    # drop this service and point the embed role at Ollama (`bge-m3`) instead.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    platform: linux/amd64
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3"]
    volumes:
      - embeddings-data:/data

volumes:
  postgres-data:
  db-secrets:
  blobs-data:
  idp-data:
  # The instance secret key and the web client's OIDC secret (read-only for the server).
  server-secrets:
  laya-models:
  ollama-data:
  embeddings-data:
