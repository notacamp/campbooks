# Campbooks for self-hosters.
#
#   cp .env.example .env        # then edit it
#   docker compose up -d        # server, postgres, identity provider
#   docker compose --profile ai up -d     # + local open-weight models
#
# See README.md in this directory.
name: campbooks

services:
  server:
    image: ghcr.io/notacamp/campbooks:next
    restart: unless-stopped
    env_file: .env
    environment:
      # Built from POSTGRES_PASSWORD so the two never drift apart.
      CAMPBOOKS_DATABASE_URL: postgres://campbooks:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/campbooks
      # Trust the bundled IdP's access tokens (ADR 0004). To use another IdP,
      # change these two lines (and drop the idp services).
      CAMPBOOKS_AUTH__ISSUER: ${CAMPBOOKS_IDP_URL:-http://localhost:8081}/auth/v1/
      CAMPBOOKS_AUTH__JWKS_URL: http://idp:8080/auth/v1/oidc/certs
    # Web app and API on one port (the image sets CAMPBOOKS_WEB_DIR).
    ports:
      - "${CAMPBOOKS_PORT:-8080}:8080"
    # Message bodies, attachments and files (CAMPBOOKS_BLOBS__PATH). Back it
    # up with Postgres; unused when CAMPBOOKS_BLOBS__BACKEND=s3.
    volumes:
      - blobs-data:/data/blobs
    depends_on:
      postgres:
        condition: service_healthy
    # The image's HEALTHCHECK runs `campbooks-server healthcheck`.

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: campbooks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: campbooks
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campbooks -d campbooks"]
      interval: 5s
      timeout: 5s
      retries: 20

  # --- Identity provider (OIDC / OAuth 2.1) -------------------------------------
  # Rauthy (ADR 0004). Three services, no manual steps:
  #   idp-init       one-shot: generates secrets on first boot, writes config
  #   idp            the IdP itself; issuer = ${CAMPBOOKS_IDP_URL}/auth/v1/
  #   idp-provision  one-shot: registers Campbooks' scopes and clients
  # Admin UI: ${CAMPBOOKS_IDP_URL}/auth/v1/admin — see README.md for first login.
  idp-init:
    image: busybox:1.37.0-musl
    restart: "no"
    command: ["sh", "/idp/init.sh"]
    environment:
      CAMPBOOKS_IDP_URL: ${CAMPBOOKS_IDP_URL:-http://localhost:8081}
      CAMPBOOKS_IDP_ADMIN_EMAIL: ${CAMPBOOKS_IDP_ADMIN_EMAIL:-admin@localhost}
      CAMPBOOKS_IDP_TRUSTED_PROXIES: ${CAMPBOOKS_IDP_TRUSTED_PROXIES:-}
    volumes:
      - ./idp:/idp:ro
      - idp-data:/app/data

  idp:
    image: ghcr.io/sebadob/rauthy:0.36.2
    restart: unless-stopped
    # Rauthy needs a few seconds for a clean shutdown; a force-kill costs a WAL
    # integrity check on the next start.
    stop_grace_period: 30s
    command: ["serve", "--config-file", "/app/data/config.toml", "--secrets-file", "/app/data/secrets.toml"]
    # Rauthy reads its config from the volume (written by idp-init). Optional
    # outgoing mail (password resets, invitations): add SMTP_URL, SMTP_USERNAME,
    # SMTP_PASSWORD and SMTP_FROM under `environment:` here.
    volumes:
      - idp-data:/app/data
    ports:
      - "${CAMPBOOKS_IDP_PORT:-8081}:8080"
    depends_on:
      idp-init:
        condition: service_completed_successfully
    healthcheck:
      # The image is distroless; idp-init drops a static busybox into the volume.
      test: ["CMD", "/app/data/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/auth/v1/ping"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  idp-provision:
    image: curlimages/curl:8.22.0
    restart: "no"
    user: "10001:10001"
    entrypoint: ["sh", "/idp/provision.sh"]
    environment:
      CAMPBOOKS_PUBLIC_URL: ${CAMPBOOKS_PUBLIC_URL:-http://localhost:8080}
    volumes:
      - ./idp:/idp:ro
      - idp-data:/app/data
    depends_on:
      idp:
        condition: service_healthy

  # --- Local AI (open-weight models) --------------------------------------------
  # CPU inference works but is slow; see README.md.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.40.3
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # GPU (NVIDIA): uncomment and install the NVIDIA Container Toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  embeddings:
    profiles: ["ai"]
    # The CPU build of TEI is published for linux/amd64 only. On arm64 hosts,
    # drop this service and point the embed role at Ollama (`bge-m3`) instead.
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.4
    platform: linux/amd64
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3"]
    volumes:
      - embeddings-data:/data

volumes:
  postgres-data:
  blobs-data:
  idp-data:
  ollama-data:
  embeddings-data:
