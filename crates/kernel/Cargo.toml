[package]
name = "campbooks-kernel"
description = "Campbooks kernel: config, errors, state, ids, clock, durable events and jobs, blob storage, module contract. Knows no domain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Helpers for module tests (`campbooks_kernel::testing`). Enable as a dev-dependency only.
test-util = ["dep:http-body-util"]

[dependencies]
# SHA-256 of blobs and of idempotent requests; already the crypto backend of
# rustls and jsonwebtoken.
aws-lc-rs.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
figment.workspace = true
futures-util.workspace = true
http-body-util = { workspace = true, optional = true }
jsonwebtoken.workspace = true
object_store.workspace = true
opentelemetry.workspace = true
# The W3C trace-context propagator (`telemetry`).
opentelemetry_sdk.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
# The `testing` module is also compiled for the kernel's own unit tests.
base64.workspace = true
http-body-util.workspace = true

[lints]
workspace = true
