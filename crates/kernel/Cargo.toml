[package]
name = "campbooks-kernel"
description = "Campbooks kernel: config, errors, state, ids, clock, events, module contract. Knows no domain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Helpers for module tests (`campbooks_kernel::testing`). Enable as a dev-dependency only.
test-util = ["dep:tower", "dep:http-body-util", "dep:aws-lc-rs"]

[dependencies]
aws-lc-rs = { workspace = true, optional = true }
axum.workspace = true
chrono.workspace = true
figment.workspace = true
http-body-util = { workspace = true, optional = true }
jsonwebtoken.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true, optional = true }
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
# The `testing` module is also compiled for the kernel's own unit tests.
aws-lc-rs.workspace = true
base64.workspace = true
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
