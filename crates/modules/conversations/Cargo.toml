[package]
name = "campbooks-conversations"
description = "Campbooks conversations module: inboxes, conversations and messages on any channel (email first), streams, labels and the decide pass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Sanitising email HTML bodies (`domain::sanitize`).
ammonia.workspace = true
# Inlining their style sheets and filtering their CSS (`domain::sanitize`).
css-inline.workspace = true
cssparser.workspace = true
html5ever.workspace = true
# The sender's own calendar data (`domain::structured`, ADR 0020).
icalendar.workspace = true
axum.workspace = true
# Opaque list cursors.
base64.workspace = true
campbooks-ai.workspace = true
campbooks-kernel.workspace = true
chrono.workspace = true
# The zones of an invitation (`domain::structured`).
chrono-tz.workspace = true
# The module's settings section (`CAMPBOOKS_CONVERSATIONS__*`).
figment.workspace = true
# Reading blob streams.
futures-util.workspace = true
# The image policy over ammonia's canonical output (`domain::sanitize`).
regex.workspace = true
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
# Sanitising off the async workers (`get_message_body`).
tokio.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true

[dev-dependencies]
boon.workspace = true
campbooks-kernel = { workspace = true, features = ["test-util"] }
# `Kit::get_raw`: whole responses (headers and bytes).
tower.workspace = true
# A paused clock for the streamed reply's limits.
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true

[lints]
workspace = true
