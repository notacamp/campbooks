[package]
name = "campbooks-server"
description = "Campbooks server: loads config, runs migrations, composes modules, serves the API and OpenAPI, runs the job worker."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "campbooks-server"
path = "src/main.rs"

[dependencies]
# The BFF's crypto (AES-256-GCM, HKDF, SHA-256, randomness): the library
# rustls and jsonwebtoken already use.
aws-lc-rs.workspace = true
axum.workspace = true
base64.workspace = true
campbooks-kernel.workspace = true
campbooks-system.workspace = true
campbooks-workspaces.workspace = true
chrono.workspace = true
clap.workspace = true
opentelemetry.workspace = true
opentelemetry-otlp.workspace = true
opentelemetry-prometheus.workspace = true
opentelemetry_sdk.workspace = true
prometheus.workspace = true
reqwest.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-opentelemetry.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
log.workspace = true
campbooks-kernel = { workspace = true, features = ["test-util"] }
opentelemetry_sdk = { workspace = true, features = ["testing"] }

[lints]
workspace = true
